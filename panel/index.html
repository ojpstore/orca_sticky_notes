<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>스티커 메모</title>
    <style>
      * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--orca-border) transparent; }
      [hidden] { display: none !important; }
      html, body { height: 100%; }
      :root { --radius: var(--orca-radius, 6px); }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        font: 13px/1.55 system-ui, 'Segoe UI', 'Malgun Gothic', sans-serif;
        color: var(--orca-foreground);
        background: var(--orca-background);
      }
      button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
      :focus-visible { outline: 2px solid var(--orca-ring); outline-offset: -1px; }
      svg { display: block; width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

      .view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      .bar { display: flex; align-items: center; flex: none; }
      .spacer { flex: 1; }
      .icon { width: 28px; height: 28px; display: grid; place-items: center; color: var(--orca-muted-foreground); border-radius: var(--radius); }
      .icon:hover, .icon[aria-expanded='true'], .icon[aria-pressed='true'] { background: var(--orca-accent); color: var(--orca-accent-foreground); }
      .icon:disabled { opacity: 0.5; cursor: default; }

      .banner { flex: none; margin: 0; padding: 6px 12px; font-size: 12px; color: var(--orca-destructive-foreground); background: var(--orca-destructive); }
      .banner button { text-decoration: underline; }

      .header { gap: 2px; padding: 8px 8px 8px 12px; }
      h1 { flex: 1; min-width: 0; margin: 0; font-size: 14px; font-weight: 600; }
      .settings { margin: 0 12px 10px; padding: 8px 10px; font-size: 12px; display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--orca-border); border-radius: var(--radius); }
      .settings label { display: flex; align-items: center; gap: 8px; cursor: pointer; }

      .filter { display: flex; gap: 6px; flex: none; margin: 0 12px 10px; }
      select, .search input, #group-name {
        height: 30px;
        font: inherit;
        color: inherit;
        background: transparent;
        border: 1px solid var(--orca-input);
        border-radius: var(--radius);
      }
      select { flex: none; min-width: 0; padding: 0 4px; }
      select option { color: var(--orca-popover-foreground); background: var(--orca-popover); }
      .search { position: relative; flex: 1; min-width: 0; }
      .search input { width: 100%; padding: 0 30px 0 10px; }
      .search input::placeholder { color: var(--orca-muted-foreground); }
      .search input::-webkit-search-cancel-button { display: none; }
      .search svg { position: absolute; top: 7px; right: 8px; color: var(--orca-muted-foreground); pointer-events: none; }

      .groups { align-items: flex-start; gap: 2px; margin: 0 12px 6px; }
      #group { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; gap: 4px; padding-top: 2px; }
      .tab {
        max-width: 100%;
        height: 24px;
        padding: 0 10px;
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: var(--orca-muted-foreground);
        border: 1px solid var(--orca-border);
        border-radius: var(--radius);
      }
      .tab:hover { color: var(--orca-accent-foreground); background: var(--orca-accent); }
      .tab[aria-pressed='true'] { color: var(--orca-primary-foreground); background: var(--orca-primary); border-color: var(--orca-primary); }
      .tab.drop { outline: 2px dashed var(--orca-ring); outline-offset: 1px; }
      .tab[draggable='true'] { cursor: grab; }
      .tab.dragging { opacity: 0.5; }
      .tab-count { margin-left: 4px; font-size: 11px; opacity: 0.72; }
      .card[draggable='true'] { cursor: grab; }
      .card.dragging { opacity: 0.5; }
      #group-edit { gap: 6px; margin: 0 12px 8px; }
      #group-name { flex: 1; min-width: 0; padding: 0 8px; }
      #group-edit button { height: 26px; padding: 0 10px; border-radius: var(--radius); color: var(--orca-secondary-foreground); background: var(--orca-secondary); }
      #note-group { height: 26px; max-width: 50%; }
      .list-tools { justify-content: space-between; gap: 6px; margin: -4px 12px 6px; }
      .color-filter { display: flex; align-items: center; gap: 5px; }
      .color-dot { width: 13px; height: 13px; padding: 0; background: var(--c); border-radius: 50%; opacity: 0.7; }
      .color-dot:hover { opacity: 1; }
      .color-dot[aria-pressed='true'] { opacity: 1; box-shadow: 0 0 0 2px var(--orca-background), 0 0 0 3px var(--orca-foreground); }
      .color-all { width: auto; height: 18px; padding: 0 6px; font-size: 11px; border-radius: var(--radius); color: var(--orca-muted-foreground); border: 1px solid var(--orca-border); background: none; opacity: 1; }
      .color-all[aria-pressed='true'] { color: var(--orca-primary-foreground); background: var(--orca-primary); border-color: var(--orca-primary); box-shadow: none; }

      .cards { flex: 1; min-height: 0; overflow-y: auto; padding: 0 12px 12px; display: flex; flex-direction: column; gap: 8px; }
      .card {
        flex: none;
        overflow: hidden;
        color: var(--orca-card-foreground);
        background: var(--orca-card);
        border: 1px solid var(--orca-border);
        border-radius: var(--radius);
      }
      .card::before { content: ''; display: block; height: 2px; background: var(--c); }
      .card:has(.card-body:hover) { border-color: var(--orca-input); }
      .card-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 2px 8px; min-height: 34px; padding: 4px 8px 4px 12px; }
      .card-title { flex: 1 1 96px; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .card-title[aria-expanded] { cursor: pointer; }
      .card-title[aria-expanded]::before { content: '▸'; display: inline-block; width: 14px; color: var(--orca-muted-foreground); }
      .card-title[aria-expanded='true']::before { content: '▾'; }
      .card-pin { flex: none; width: 13px; height: 13px; margin-right: auto; color: var(--c); }
      .card-title .card-pin { display: inline-block; margin-right: 5px; vertical-align: -2px; }
      .apply {
        flex: none;
        height: 22px;
        padding: 0 8px;
        font-size: 11px;
        font-weight: 500;
        white-space: nowrap;
        color: var(--orca-foreground);
        border: 1px solid color-mix(in srgb, var(--orca-foreground) 35%, transparent);
        border-radius: var(--radius);
      }
      .apply:hover:not(:disabled) { color: var(--orca-primary-foreground); background: var(--orca-primary); border-color: var(--orca-primary); }
      .apply:disabled { opacity: 0.6; cursor: default; }
      .card-copy { width: 22px; height: 22px; padding: 0; }
      .card-copy svg { width: 13px; height: 13px; }
      .card-top.divided + .card-body { border-top: 1px solid var(--orca-border); margin: 0 12px; padding: 8px 0 10px; }
      .card-body { min-height: 24px; padding: 0 12px 10px; cursor: pointer; } /* 제목만 있는 메모도 누를 영역이 남아야 한다. */
      .preview:empty { display: none; }
      .preview { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5; overflow: hidden; overflow-wrap: anywhere; color: var(--orca-muted-foreground); }
      .card-top:not(.divided) + .card-body .preview { color: inherit; }
      .empty { margin: 24px 0; text-align: center; color: var(--orca-muted-foreground); }
      .status { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0; padding: 6px 12px; font-size: 12px; color: var(--orca-muted-foreground); border-top: 1px solid var(--orca-border); }
      #status-action { flex: none; color: var(--orca-primary); font-weight: 600; text-decoration: underline; }
      #tip {
        position: fixed;
        left: 0;
        right: 0;
        z-index: 1;
        max-height: 50vh;
        overflow: hidden;
        padding: 6px 12px;
        font-size: 12px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        pointer-events: none;
        color: var(--orca-popover-foreground);
        background: var(--orca-popover);
        border: 1px solid var(--orca-border);
        border-radius: var(--radius);
      }
      .footer { justify-content: flex-end; gap: 6px; padding: 6px 12px; border-top: 1px solid var(--orca-border); }
      .footer .apply { display: flex; align-items: center; gap: 4px; height: 26px; font-size: 12px; }
      .footer svg { width: 13px; height: 13px; }

      .preview ul, #editor ul { margin: 0; padding-left: 1.3em; }
      .preview ul[data-checklist], #editor ul[data-checklist] { list-style: none; padding-left: 0; }
      .preview ul[data-checklist] li, #editor ul[data-checklist] li { position: relative; padding-left: 20px; }
      .preview ul[data-checklist] li::before, #editor ul[data-checklist] li::before {
        content: '';
        position: absolute;
        left: 2px;
        top: 4px;
        width: 12px;
        height: 12px;
        border: 1.5px solid var(--orca-muted-foreground);
        border-radius: 3px;
        box-sizing: border-box;
        cursor: pointer;
      }
      .preview ul[data-checklist] li[data-checked='true'], #editor ul[data-checklist] li[data-checked='true'] {
        text-decoration: line-through;
        color: var(--orca-muted-foreground);
      }
      .preview ul[data-checklist] li[data-checked='true']::before, #editor ul[data-checklist] li[data-checked='true']::before {
        content: '✓';
        display: grid;
        place-items: center;
        font-size: 9px;
        line-height: 1;
        color: var(--orca-primary-foreground);
        background: var(--orca-primary);
        border-color: var(--orca-primary);
      }
      .var-fields { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; max-height: 50vh; overflow-y: auto; }
      .var-field { display: flex; flex-direction: column; gap: 3px; font-size: 12px; }
      .var-field input { height: 28px; padding: 0 8px; font: inherit; color: inherit; background: transparent; border: 1px solid var(--orca-input); border-radius: var(--radius); }
      .dialog .primary { color: var(--orca-primary-foreground); background: var(--orca-primary); }

      #note { border-top: 2px solid var(--c); }
      #note > .bar:first-child { gap: 2px; padding: 6px 8px; }
      #swatches { gap: 8px; padding: 4px 12px 8px; }
      .swatch { width: 18px; height: 18px; padding: 0; background: var(--c); border-radius: 50%; }
      .swatch[aria-pressed='true'] { box-shadow: 0 0 0 2px var(--orca-background), 0 0 0 3px var(--orca-foreground); }
      .confirm { gap: 6px; margin: 0 8px 6px; padding: 6px 8px 6px 10px; font-size: 12px; border: 1px solid var(--orca-border); border-radius: var(--radius); }
      .confirm button, .dialog button { height: 24px; padding: 0 10px; border-radius: var(--radius); color: var(--orca-secondary-foreground); background: var(--orca-secondary); }
      .confirm .danger, .dialog .danger { color: var(--orca-destructive-foreground); background: var(--orca-destructive); }
      .dialog {
        width: min(280px, calc(100vw - 32px));
        padding: 14px 16px 12px;
        color: var(--orca-popover-foreground);
        background: var(--orca-popover);
        border: 1px solid var(--orca-border);
        border-radius: var(--radius);
        box-shadow: 0 8px 24px rgb(0 0 0 / 0.3);
      }
      .dialog::backdrop { background: rgb(0 0 0 / 0.4); }
      .dialog p { margin: 0 0 12px; overflow-wrap: anywhere; }
      .dialog .bar { justify-content: flex-end; gap: 6px; }
      .title-row { gap: 2px; padding-right: 8px; border-bottom: 1px solid var(--orca-border); }
      #title {
        flex: 1;
        min-width: 0;
        padding: 6px 4px 8px 12px;
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        color: inherit;
        background: none;
        border: 0;
        outline: none;
      }
      #title::placeholder { color: var(--orca-muted-foreground); font-weight: 400; }
      #emojis { flex: none; display: flex; flex-direction: column; height: min(340px, 60vh); border-bottom: 1px solid var(--orca-border); }
      .emoji-search { gap: 8px; padding: 8px 10px 4px; }
      .tones { display: flex; flex: none; gap: 4px; }
      .tone { width: 16px; height: 16px; padding: 0; background: var(--c); border-radius: 4px; }
      .tones:not(.open) .tone[aria-pressed='false'] { display: none; }
      .tones.open .tone[aria-pressed='true'] { box-shadow: 0 0 0 1px var(--orca-background), 0 0 0 2px var(--orca-foreground); }
      #emoji-tabs { justify-content: space-between; padding: 0 6px 2px; border-bottom: 1px solid var(--orca-border); }
      #emoji-tabs .icon[aria-pressed='true'] { background: none; color: var(--orca-primary); }
      #emoji-sections { position: relative; flex: 1; min-height: 0; overflow-y: auto; padding: 0 10px 6px; }
      #emoji-sections h2 { position: sticky; top: 0; margin: 0; padding: 6px 0 2px; font-size: 12px; font-weight: 600; background: var(--orca-background); }
      .emoji-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(32px, 1fr)); }
      .emoji-grid button { height: 32px; padding: 0; font-size: 20px; line-height: 1; border-radius: var(--radius); }
      .emoji-grid button:hover { background: var(--orca-accent); }
      #emoji-preview { gap: 8px; height: 44px; padding: 0 12px; font-size: 12px; border-top: 1px solid var(--orca-border); }
      #emoji-preview-glyph { font-size: 26px; line-height: 1; }
      #emoji-preview-name { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #editor { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 12px; outline: none; overflow-wrap: anywhere; }
      #editor:empty::before { content: attr(data-placeholder); color: var(--orca-muted-foreground); }
      #format { gap: 2px; padding: 6px 8px; border-top: 1px solid var(--orca-border); }
      #format .icon { font-size: 13px; }
</style>
  </head>
  <body>
    <p id="error" class="banner" role="alert" hidden></p>

    <section id="list" class="view">
      <div class="bar header">
        <h1>스티커 메모</h1>
        <button id="add" class="icon" aria-label="새 메모" title="새 메모">
          <svg viewBox="0 0 20 20"><path d="M10 3v14M3 10h14" /></svg>
        </button>
        <button id="gear" class="icon" aria-label="설정" title="설정" aria-expanded="false">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-2.8 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.9l.1-.1a1.7 1.7 0 0 0-1.2-2.8H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.9-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.9l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" /></svg>
        </button>
      </div>
      <div id="settings" class="settings" hidden>
        <label><input id="confirm-setting" type="checkbox" /> 삭제하기 전에 확인</label>
        <label><input id="remember-expanded" type="checkbox" /> 카드 펼침 상태 기억</label>
      </div>
      <div class="bar groups">
        <div id="group" role="group" aria-label="그룹 (메모를 끌어 놓으면 그 그룹으로 옮깁니다)"></div>
        <button id="group-add" class="icon" aria-label="새 그룹" title="새 그룹">
          <svg viewBox="0 0 20 20"><path d="M2.5 5.5a1 1 0 0 1 1-1h4l1.5 2h7.5a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1h-13a1 1 0 0 1-1-1z" /><path d="M10 9v5M7.5 11.5h5" /></svg>
        </button>
        <button id="group-rename" class="icon" aria-label="그룹 이름 바꾸기" title="그룹 이름 바꾸기">
          <svg viewBox="0 0 20 20"><path d="M13.5 3.5l3 3L7 16H4v-3z" /></svg>
        </button>
        <button id="group-delete" class="icon" aria-label="그룹 삭제" title="그룹 삭제 (메모는 '기본' 그룹으로 옮겨집니다)">
          <svg viewBox="0 0 20 20"><path d="M3.5 5.5h13M8 5.5V3.5h4v2m-7 0 .8 11h8.4l.8-11M8.5 8.5v5m3-5v5" /></svg>
        </button>
      </div>
      <form id="group-edit" class="bar" hidden>
        <input id="group-name" type="text" placeholder="그룹 이름" aria-label="그룹 이름" autocomplete="off" required />
        <button type="submit">확인</button>
        <button id="group-cancel" type="button">취소</button>
      </form>
      <dialog id="group-confirm" class="dialog" role="alertdialog" aria-labelledby="group-confirm-text">
        <p id="group-confirm-text"></p>
        <div class="bar">
          <button id="group-confirm-yes" class="danger">삭제</button>
          <button id="group-confirm-no" autofocus>취소</button>
        </div>
      </dialog>
      <div class="filter">
        <select id="scope" aria-label="조회 조건">
          <option value="all">전체</option>
          <option value="title">제목</option>
          <option value="text">내용</option>
        </select>
        <div class="search">
          <input id="query" type="search" placeholder="검색..." aria-label="메모 검색" />
          <svg viewBox="0 0 20 20"><circle cx="9" cy="9" r="5.5" /><path d="m13 13 4 4" /></svg>
        </div>
      </div>
      <div class="bar list-tools">
        <div id="color-filter" class="color-filter" role="group" aria-label="색상 필터"></div>
        <button id="toggle-expand" class="icon" aria-label="전체 펼치기" title="전체 펼치기">
          <svg viewBox="0 0 20 20"><path d="m6 7 4-4 4 4M6 13l4 4 4-4" /></svg>
        </button>
      </div>
      <div id="cards" class="cards"></div>
      <div id="tip" role="tooltip" hidden></div>
      <div id="status" class="status" role="status" hidden>
        <span id="status-text"></span>
        <button id="status-action" hidden></button>
      </div>
      <dialog id="var-dialog" class="dialog" aria-labelledby="var-dialog-title">
        <p id="var-dialog-title">변수 값을 입력하세요</p>
        <form id="var-form">
          <div id="var-fields" class="var-fields"></div>
          <div class="bar">
            <button type="submit" class="primary">확인</button>
            <button id="var-cancel" type="button">취소</button>
          </div>
        </form>
      </dialog>
      <div class="bar footer">
        <button id="backup" class="apply" title="메모를 JSON 파일로 저장">
          <svg viewBox="0 0 20 20"><path d="M10 3v12m-5-5 5 5 5-5" /></svg>백업
        </button>
        <button id="import" class="apply" title="백업 파일의 메모를 현재 메모에 합치기">
          <svg viewBox="0 0 20 20"><path d="M10 17V5m-5 5 5-5 5 5" /></svg>임포트
        </button>
        <input id="import-file" type="file" accept=".json,application/json" aria-label="백업 파일" hidden />
      </div>
    </section>

    <section id="note" class="view" hidden>
      <div class="bar">
        <button id="back" class="icon" aria-label="메모 목록" title="메모 목록">
          <svg viewBox="0 0 20 20"><path d="M16 10H4m5-5-5 5 5 5" /></svg>
        </button>
        <select id="note-group" aria-label="메모 그룹" title="메모 그룹"></select>
        <span class="spacer"></span>
        <button id="pin" class="icon" aria-label="고정" title="고정" aria-pressed="false">
          <svg viewBox="0 0 20 20"><path d="M7 3h6M8 3v5.500L5.500 12h9L12 8.500V3M10 12v5" /></svg>
        </button>
        <button id="duplicate" class="icon" aria-label="메모 복제" title="메모 복제 (Ctrl+D)">
          <svg viewBox="0 0 20 20"><rect x="7" y="7" width="9" height="9" rx="1.5" /><path d="M5 13H4.5A1.5 1.5 0 0 1 3 11.5v-7A1.5 1.5 0 0 1 4.5 3h7A1.5 1.5 0 0 1 13 4.5V5" /></svg>
        </button>
        <button id="palette" class="icon" aria-label="색상" title="색상" aria-expanded="false">
          <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" /><circle cx="10" cy="10" r="2.5" fill="currentColor" /></svg>
        </button>
        <button id="delete" class="icon" aria-label="메모 삭제" title="메모 삭제">
          <svg viewBox="0 0 20 20"><path d="M3.5 5.5h13M8 5.5V3.5h4v2m-7 0 .8 11h8.4l.8-11M8.5 8.5v5m3-5v5" /></svg>
        </button>
      </div>
      <div id="swatches" class="bar" hidden></div>
      <div id="confirm" class="bar confirm" hidden>
        <span class="spacer">이 메모를 삭제할까요?</span>
        <button id="confirm-yes" class="danger">삭제</button>
        <button id="confirm-no">취소</button>
      </div>
      <div class="bar title-row">
        <input id="title" type="text" placeholder="제목" aria-label="메모 제목" autocomplete="off" />
        <button id="emoji" class="icon" aria-label="이모지" title="이모지" aria-expanded="false">
          <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" /><path d="M7 12c.7 1 1.7 1.5 3 1.5s2.300-.5 3-1.5M7.500 8h.01M12.500 8h.01" /></svg>
        </button>
      </div>
      <div id="emojis" role="group" aria-label="이모지 선택" hidden>
        <div class="bar emoji-search">
          <div class="search">
            <input id="emoji-query" type="search" placeholder="이모지 검색" aria-label="이모지 검색" autocomplete="off" />
            <svg viewBox="0 0 20 20"><circle cx="9" cy="9" r="5.5" /><path d="m13 13 4 4" /></svg>
          </div>
          <div id="tones" class="tones" role="group" aria-label="피부색"></div>
        </div>
        <div id="emoji-tabs" class="bar"></div>
        <div id="emoji-sections">
          <p id="emoji-empty" class="empty" hidden>검색 결과가 없습니다.</p>
        </div>
        <div id="emoji-preview" class="bar">
          <span id="emoji-preview-glyph"></span>
          <span id="emoji-preview-name"></span>
        </div>
      </div>
      <div id="editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="메모 내용" data-placeholder="메모 입력..."></div>
      <div id="format" class="bar">
        <button class="icon" data-command="bold" aria-label="굵게" aria-pressed="false" title="굵게 (Ctrl+B)"><b>B</b></button>
        <button class="icon" data-command="italic" aria-label="기울임꼴" aria-pressed="false" title="기울임꼴 (Ctrl+I)"><i>I</i></button>
        <button class="icon" data-command="underline" aria-label="밑줄" aria-pressed="false" title="밑줄 (Ctrl+U)"><u>U</u></button>
        <button class="icon" data-command="strikeThrough" aria-label="취소선" aria-pressed="false" title="취소선"><s>ab</s></button>
        <button class="icon" data-command="insertUnorderedList" aria-label="글머리 기호" aria-pressed="false" title="글머리 기호">
          <svg viewBox="0 0 20 20"><path d="M8 5h9M8 10h9M8 15h9M3.5 5h.01M3.5 10h.01M3.5 15h.01" stroke-width="2" /></svg>
        </button>
        <button id="format-check" class="icon" aria-label="체크리스트" aria-pressed="false" title="체크리스트">
          <svg viewBox="0 0 20 20"><rect x="3" y="4" width="4.5" height="4.5" rx="1" /><path d="m4.2 6.2 1 1 1.6-1.8M10 6.2h7" /><rect x="3" y="11.5" width="4.5" height="4.5" rx="1" /><path d="M10 13.8h7" /></svg>
        </button>
        <button id="format-emoji" class="icon" aria-label="이모지" title="이모지" aria-expanded="false">
          <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" /><path d="M7 12c.7 1 1.7 1.5 3 1.5s2.300-.5 3-1.5M7.500 8h.01M12.500 8h.01" /></svg>
        </button>
      </div>
    </section>

    <script type="module">
      import { EMOJI_GROUPS } from './emoji-data.js'
      import { backupJson, COLORS, countByGroup, DEFAULT_EMOJIS, duplicateNote, extractVars, fillVars, matchesEmoji, mergeGroups, mergeNotes, newGroup, newNote, parseBackup, persistable, pruneDeleted, pushRecent, reorder, reorderGroups, syncGroups, syncNotes, ungroupOrphans, visibleNotes, withDefaults } from './notes.js'

      const $ = (id) => document.getElementById(id)
      const editor = $('editor')
      const title = $('title')
      const SAVE_DELAY_MS = 300
      const RETRY_DELAY_MS = 3000
      const STATUS_MS = 4000
      const TIP_DELAY_MS = 400
      const TIP_GAP_PX = 4
      const NOTE_TAGS = new Set(['B', 'I', 'U', 'S', 'STRIKE', 'STRONG', 'EM', 'UL', 'OL', 'LI', 'DIV', 'P', 'BR', 'SPAN'])
      const SKIN_TONES = [
        ['기본', '#ffc83d'],
        ['하얀 피부', '#f7dece'],
        ['연한 갈색 피부', '#f3d2a2'],
        ['갈색 피부', '#d5ab88'],
        ['진한 갈색 피부', '#af7e57'],
        ['검은색 피부', '#7c533e']
      ]
      // 자주 사용, EMOJI_GROUPS 순서다.
      const EMOJI_TAB_ICONS = [
        '<circle cx="10" cy="10" r="7" /><path d="M10 6v4l3 2" />',
        '<circle cx="10" cy="10" r="7" /><path d="M7 12c.7 1 1.7 1.5 3 1.5s2.3-.5 3-1.5M7.5 8h.01M12.5 8h.01" />',
        '<path d="M4 3.5 7.5 6h5L16 3.5V11a6 6 0 0 1-12 0zM8 10.5h.01M12 10.5h.01M9 13.5h2" />',
        '<path d="M3.5 9a6.5 6 0 0 1 13 0zM3 12h14M4 15h12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z" />',
        '<rect x="4" y="3" width="12" height="12" rx="2" /><path d="M4 10h12M7 15v2M13 15v2M7 12.5h.01M13 12.5h.01" />',
        '<circle cx="10" cy="10" r="7" /><path d="M5 5c3 3 3 7 0 10M15 5c-3 3-3 7 0 10" />',
        '<path d="M7 3 3 6l2 3 2-1v9h6V8l2 1 2-3-4-3c-.5 1.3-1.5 2-3 2s-2.5-.7-3-2z" />',
        '<path d="M8 15V5l8-2v10" /><circle cx="6" cy="15" r="2" /><circle cx="14" cy="13" r="2" />',
        '<path d="M5 17V3.5c3-1.5 5 1.5 10 0v8c-5 1.5-7-1.5-10 0" />'
      ]

      let notes = []
      let groups = [] // { id, name }. 기본 그룹(id '')은 목록에 없다.
      let deletedNotes = {} // { [id]: deletedAt } 다중 창 동기화용 삭제 기록
      let deletedGroups = {} // { [id]: deletedAt }
      const ALL_GROUPS = '*' // '모든 그룹' 탭의 값
      const NOTE_DRAG_TYPE = 'application/x-sticky-note-id'
      const GROUP_DRAG_TYPE = 'application/x-sticky-group-id'
      let selectedGroup = ALL_GROUPS
      let selectedColor = null
      let lastDeleted = null // 삭제 직후 실행 취소용
      const lastVarValues = {} // 변수 치환 직전 입력값 기억
      let current = null
      let confirmDelete = true
      let rememberExpanded = false
      let recentEmojis = DEFAULT_EMOJIS
      let emojiTone = 0 // SKIN_TONES 위치. 0은 피부색 없는 기본 글자다.
      let emojiSections = [] // 처음 열 때 만든다. 글자 버튼이 2천 개 가까워서 메모만 보는 동안에는 만들지 않는다.
      const emojiCells = [] // { button, entry }
      const emojiNames = new Map()
      let loaded = false // 불러오기 전에는 절대 저장하지 않는다. 빈 목록으로 덮어쓰면 메모가 사라진다.
      let saveTimer = null
      let statusTimer = null
      let statusActionHandler = null
      let tipTimer = null
      let tipHeader = null
      const expanded = new Set() // 펼친 메모 id
      let writes = Promise.resolve()

      function showError(message, retry) {
        const banner = $('error')
        banner.hidden = !message
        banner.textContent = message ?? ''
        if (!retry) return
        const button = document.createElement('button')
        button.textContent = '다시 시도'
        button.addEventListener('click', retry)
        banner.append(' ', button)
      }

      const mergeDeleted = (a, b) => {
        const merged = { ...a }
        for (const [id, at] of Object.entries(b ?? {})) {
          if (Number.isFinite(at)) merged[id] = Math.max(merged[id] ?? 0, at)
        }
        return pruneDeleted(merged)
      }

      // 저장 직전에 최신 스토리지와 병합해 다중 창 동시 편집 시 다른 창의 변경이 덮어쓰이지 않게 한다.
      function flush() {
        clearTimeout(saveTimer)
        saveTimer = null
        if (!loaded) return
        const localNotes = persistable(notes)
        const localGroups = [...groups]
        const localDeletedNotes = { ...deletedNotes }
        const localDeletedGroups = { ...deletedGroups }
        writes = writes
          .then(async () => {
            const [remoteNotes, remoteGroups, remoteDeletedNotes, remoteDeletedGroups] = await Promise.all([
              orca.storage.get('notes'),
              orca.storage.get('groups'),
              orca.storage.get('deletedNotes'),
              orca.storage.get('deletedGroups')
            ])
            const mergedDeletedNotes = mergeDeleted(localDeletedNotes, remoteDeletedNotes)
            const mergedDeletedGroups = mergeDeleted(localDeletedGroups, remoteDeletedGroups)
            const mergedGroups = syncGroups(localGroups, Array.isArray(remoteGroups) ? remoteGroups : [], mergedDeletedGroups)
            const mergedNotes = ungroupOrphans(
              syncNotes(localNotes, Array.isArray(remoteNotes) ? withDefaults(remoteNotes) : [], mergedDeletedNotes),
              mergedGroups
            )
            deletedNotes = mergedDeletedNotes
            deletedGroups = mergedDeletedGroups
            await Promise.all([
              orca.storage.set('notes', mergedNotes),
              orca.storage.set('groups', mergedGroups),
              orca.storage.set('deletedNotes', mergedDeletedNotes),
              orca.storage.set('deletedGroups', mergedDeletedGroups)
            ])
          })
          .then(
            () => showError(null),
            () => {
              showError('저장하지 못했습니다. 잠시 후 다시 시도합니다.')
              scheduleSave(RETRY_DELAY_MS)
            }
          )
      }

      async function syncFromStorage() {
        if (!loaded || saveTimer !== null) return
        try {
          const [remoteNotes, remoteGroups, remoteDeletedNotes, remoteDeletedGroups] = await Promise.all([
            orca.storage.get('notes'),
            orca.storage.get('groups'),
            orca.storage.get('deletedNotes'),
            orca.storage.get('deletedGroups')
          ])
          const nextDeletedNotes = mergeDeleted(deletedNotes, remoteDeletedNotes)
          const nextDeletedGroups = mergeDeleted(deletedGroups, remoteDeletedGroups)
          const nextGroups = syncGroups(groups, Array.isArray(remoteGroups) ? remoteGroups : [], nextDeletedGroups)
          const nextNotes = ungroupOrphans(
            syncNotes(notes, Array.isArray(remoteNotes) ? withDefaults(remoteNotes) : [], nextDeletedNotes),
            nextGroups
          )
          deletedNotes = nextDeletedNotes
          deletedGroups = nextDeletedGroups
          const changed = JSON.stringify(notes) !== JSON.stringify(nextNotes) || JSON.stringify(groups) !== JSON.stringify(nextGroups)
          if (!changed) return
          notes = nextNotes
          groups = nextGroups
          if (current) {
            const updated = notes.find((note) => note.id === current.id)
            if (updated) {
              const newer = updated.updatedAt > current.updatedAt
              current = updated
              if (newer) {
                title.value = current.title
                editor.innerHTML = current.html
                $('note-group').value = current.group
                $('pin').setAttribute('aria-pressed', String(current.pinned))
                renderSwatches()
              }
            }
          }
          renderGroups()
          renderList()
        } catch {
          // 백그라운드 동기화 실패는 무시한다.
        }
      }

      function scheduleSave(delay = SAVE_DELAY_MS) {
        clearTimeout(saveTimer)
        saveTimer = setTimeout(flush, delay)
      }

      function saveExpanded() {
        if (!loaded || !rememberExpanded) return
        orca.storage.set('expandedIds', [...expanded]).catch(() => showError('설정을 저장하지 못했습니다.'))
      }

      function showStatus(message, action = null, duration = action ? 6000 : STATUS_MS) {
        clearTimeout(statusTimer)
        $('status-text').textContent = message
        const button = $('status-action')
        statusActionHandler = action?.onClick ?? null
        button.textContent = action?.label ?? ''
        button.hidden = !action
        $('status').hidden = false
        statusTimer = setTimeout(() => {
          $('status').hidden = true
          statusActionHandler = null
        }, duration)
      }

      function hideTip() {
        clearTimeout(tipTimer)
        tipHeader = null
        $('tip').hidden = true
      }

      // 기본 title 툴팁은 너비를 정할 수 없어서 패널 너비로 직접 그린다.
      function showTip(header) {
        const tip = $('tip')
        tip.textContent = header.dataset.tip
        tip.hidden = false
        const { top, bottom } = header.getBoundingClientRect()
        const fitsBelow = bottom + TIP_GAP_PX + tip.offsetHeight <= innerHeight
        tip.style.top = `${fitsBelow ? bottom + TIP_GAP_PX : Math.max(0, top - TIP_GAP_PX - tip.offsetHeight)}px`
      }

      function resolveVars(text) {
        const vars = extractVars(text)
        if (!vars.length) return Promise.resolve(text)
        const dialog = $('var-dialog')
        const fields = $('var-fields')
        fields.replaceChildren(
          ...vars.map((name) => {
            const label = document.createElement('label')
            label.className = 'var-field'
            label.textContent = name
            const input = document.createElement('input')
            input.type = 'text'
            input.name = name
            input.value = lastVarValues[name] ?? ''
            input.autocomplete = 'off'
            label.append(input)
            return label
          })
        )
        return new Promise((resolve) => {
          const finish = (value) => {
            $('var-form').removeEventListener('submit', onSubmit)
            $('var-cancel').removeEventListener('click', onCancel)
            dialog.removeEventListener('cancel', onCancel)
            dialog.removeEventListener('click', onBackdrop)
            resolve(value)
          }
          const onSubmit = (event) => {
            event.preventDefault()
            const values = {}
            for (const input of fields.querySelectorAll('input')) {
              values[input.name] = input.value
              lastVarValues[input.name] = input.value
            }
            dialog.close()
            finish(fillVars(text, values))
          }
          const onCancel = () => {
            dialog.close()
            finish(null)
          }
          const onBackdrop = (event) => {
            if (event.target === dialog) onCancel()
          }
          $('var-form').addEventListener('submit', onSubmit)
          $('var-cancel').addEventListener('click', onCancel)
          dialog.addEventListener('cancel', onCancel)
          dialog.addEventListener('click', onBackdrop)
          dialog.showModal()
          fields.querySelector('input')?.focus()
          fields.querySelector('input')?.select()
        })
      }

      async function copyText(text) {
        if (navigator.clipboard?.writeText) {
          try {
            await navigator.clipboard.writeText(text)
            return
          } catch {
            // 샌드박스 패널에서 Permissions-Policy로 막힐 수 있어 아래 폴백으로 진행한다.
          }
        }
        const area = document.createElement('textarea')
        area.value = text
        area.setAttribute('readonly', '')
        area.style.position = 'fixed'
        area.style.opacity = '0'
        document.body.append(area)
        area.focus()
        area.select()
        area.setSelectionRange(0, text.length)
        const copied = document.execCommand('copy')
        area.remove()
        if (copied) return
        await orca.plugin.request('clipboard.write', { text })
      }

      async function copyNote(note) {
        showError(null)
        const resolved = await resolveVars(note.text)
        if (resolved === null) return
        try {
          await copyText(resolved)
          showStatus('클립보드에 복사했습니다.')
        } catch {
          showError('클립보드에 복사하지 못했습니다.')
        }
      }

      async function applyToTerminal(note, run, button) {
        const resolved = await resolveVars(note.text)
        if (resolved === null) return
        button.disabled = true
        showError(null)
        try {
          const result = await orca.plugin.request('terminal.apply', { text: resolved, run })
          const merged = result.flattened ? ' 일반 셸의 여러 줄 메모라 한 줄로 합쳤습니다.' : ''
          if (result.error) showError(result.error)
          else if (!run) showStatus(`'${result.title}'에 넣었습니다.${merged}`)
          else showStatus(result.flattened ? `'${result.title}'에 넣었습니다.${merged} 실행하지 않았습니다.` : `'${result.title}'에서 실행했습니다.`)
        } catch (error) {
          showError(`터미널에 보내지 못했습니다. ${error?.message ?? error}`)
        }
        button.disabled = false
      }

      // 메모 html은 innerHTML로 그려지고 패널 CSP는 인라인 스크립트를 허용한다. 파일에서 온 html은 편집기 서식과 체크리스트 속성만 남긴다.
      function cleanHtml(html) {
        const { body } = new DOMParser().parseFromString(html, 'text/html')
        for (const element of body.querySelectorAll('*')) {
          const keepChecklist = element.tagName === 'UL' && element.hasAttribute('data-checklist')
          const checkedValue = element.tagName === 'LI' ? element.getAttribute('data-checked') : null
          for (const { name } of [...element.attributes]) element.removeAttribute(name)
          if (keepChecklist) element.setAttribute('data-checklist', '1')
          if (checkedValue === 'true' || checkedValue === 'false') element.setAttribute('data-checked', checkedValue)
          if (!NOTE_TAGS.has(element.tagName)) element.replaceWith(...element.childNodes)
        }
        return body.innerHTML
      }

      async function backup() {
        showError(null)
        try {
          const { status } = await orca.files.saveAs({
            suggestedName: `sticky-notes-${new Date().toLocaleDateString('sv')}.json`, // sv 로캘이 현지 날짜를 YYYY-MM-DD로 준다.
            mimeType: 'application/json',
            data: backupJson(notes, groups)
          })
          if (status === 'saved') showStatus(`메모 ${persistable(notes).length}개를 백업했습니다.`)
        } catch {
          showError('백업하지 못했습니다.')
        }
      }

      async function importBackup(file) {
        showError(null)
        try {
          const backup = parseBackup(await file.text())
          const imported = backup.notes.map((note) => ({ ...note, html: cleanHtml(note.html) }))
          const merged = mergeNotes(notes, imported)
          const added = merged.filter((note) => !notes.includes(note)).length
          groups = mergeGroups(groups, backup.groups)
          notes = ungroupOrphans(merged, groups)
          flush()
          renderGroups()
          renderList()
          showStatus(added ? `메모 ${added}개를 가져왔습니다.` : '새로 가져올 메모가 없습니다.')
        } catch {
          showError('백업 파일을 읽지 못했습니다.')
        }
      }

      function onActivate(element, handler) {
        element.addEventListener('click', handler)
        element.addEventListener('keydown', (event) => {
          if (event.key !== 'Enter' && event.key !== ' ') return
          event.preventDefault()
          handler()
        })
      }

      function card(note) {
        const element = document.createElement('div')
        element.className = 'card'
        element.draggable = true
        element.dataset.id = note.id
        element.style.setProperty('--c', COLORS[note.color])

        const body = document.createElement('div')
        body.className = 'card-body'
        body.tabIndex = 0
        body.setAttribute('role', 'button')
        body.setAttribute('aria-label', (note.title || note.text).slice(0, 80))

        const preview = document.createElement('div')
        preview.className = 'preview'
        preview.innerHTML = note.html // 붙여넣기와 끌어놓기를 일반 텍스트로 제한해서 편집기 서식만 들어 있다.
        preview.addEventListener('click', (event) => {
          const item = event.target.closest('ul[data-checklist] li')
          if (!item || event.clientX - item.getBoundingClientRect().left > 20) return
          event.stopPropagation()
          item.dataset.checked = item.dataset.checked === 'true' ? 'false' : 'true'
          note.html = preview.innerHTML
          note.updatedAt = Date.now()
          scheduleSave()
        })

        const top = document.createElement('div')
        top.className = 'card-top'
        top.dataset.tip = note.text.trim() || note.title // 제목만 있는 메모는 보여줄 내용이 없다.

        if (note.title.trim()) {
          const heading = document.createElement('div')
          heading.className = 'card-title'
          heading.textContent = note.title
          top.prepend(heading)

          // 내용이 있는 메모만 접는다. 제목만 있으면 접을 것이 없고, 본문 영역이 상세보기 입구로 남아야 한다.
          if (note.text.trim()) {
            const setOpen = (open) => {
              body.hidden = !open
              top.classList.toggle('divided', open)
              heading.setAttribute('aria-expanded', String(open))
            }
            heading.tabIndex = 0
            heading.setAttribute('role', 'button')
            setOpen(expanded.has(note.id))
            onActivate(heading, () => {
              const open = !expanded.delete(note.id)
              if (open) expanded.add(note.id)
              setOpen(open)
              saveExpanded()
              syncExpandToggle()
            })
          }
        }
        if (note.pinned) {
          const pin = $('pin').querySelector('svg').cloneNode(true)
          pin.classList.add('card-pin')
          pin.setAttribute('role', 'img')
          pin.setAttribute('aria-label', '고정됨')
          ;(top.querySelector('.card-title') ?? top).prepend(pin) // 제목 안에 넣어야 접기 아이콘이 맨 앞에 온다.
        }
        body.append(preview)
        onActivate(body, () => openNote(note))
        element.append(top, body)

        // 제목만 있는 메모는 넣을 내용이 없다.
        if (note.text.trim()) {
          const copyButton = document.createElement('button')
          copyButton.className = 'icon card-copy'
          copyButton.title = '내용 복사'
          copyButton.setAttribute('aria-label', '내용 복사')
          copyButton.innerHTML = '<svg viewBox="0 0 20 20"><rect x="7" y="7" width="9" height="9" rx="1.5" /><path d="M5 13H4.5A1.5 1.5 0 0 1 3 11.5v-7A1.5 1.5 0 0 1 4.5 3h7A1.5 1.5 0 0 1 13 4.5V5" /></svg>'
          copyButton.addEventListener('click', () => copyNote(note))
          top.append(copyButton)

          for (const [label, tip, run] of [['적용', '활성 터미널 입력창에 메모 내용만 넣기', false], ['실행', '활성 터미널에 메모 내용을 넣고 실행', true]]) {
            const button = document.createElement('button')
            button.className = 'apply'
            button.textContent = label
            button.title = tip
            button.addEventListener('click', () => applyToTerminal(note, run, button))
            top.append(button)
          }
        }
        return element
      }

      function renderColorFilter() {
        const container = $('color-filter')
        const all = document.createElement('button')
        all.className = 'color-dot color-all'
        all.textContent = '전체'
        all.title = '모든 색상'
        all.setAttribute('aria-pressed', String(selectedColor === null))
        all.addEventListener('click', () => {
          selectedColor = null
          renderColorFilter()
          renderList()
        })
        const dots = Object.entries(COLORS).map(([name, value]) => {
          const dot = document.createElement('button')
          dot.className = 'color-dot'
          dot.style.setProperty('--c', value)
          dot.title = `색상 필터: ${name}`
          dot.setAttribute('aria-label', dot.title)
          dot.setAttribute('aria-pressed', String(selectedColor === name))
          dot.addEventListener('click', () => {
            selectedColor = selectedColor === name ? null : name
            renderColorFilter()
            renderList()
          })
          return dot
        })
        container.replaceChildren(all, ...dots)
      }

      const EXPAND_ICON = 'm6 7 4-4 4 4M6 13l4 4 4-4'
      const COLLAPSE_ICON = 'm6 3 4 4 4-4M6 17l4-4 4 4'

      function syncExpandToggle(shown = visibleNotes(notes, $('query').value, $('scope').value, selectedGroup === ALL_GROUPS ? null : selectedGroup, selectedColor)) {
        const collapsible = shown.filter((note) => note.title.trim() && note.text.trim())
        const anyOpen = collapsible.some((note) => expanded.has(note.id))
        const button = $('toggle-expand')
        const label = anyOpen ? '전체 접기' : '전체 펼치기'
        button.disabled = !collapsible.length
        button.title = label
        button.setAttribute('aria-label', label)
        button.setAttribute('aria-pressed', String(anyOpen))
        button.querySelector('path').setAttribute('d', anyOpen ? COLLAPSE_ICON : EXPAND_ICON)
      }

      function renderList() {
        const query = $('query').value
        const shown = visibleNotes(notes, query, $('scope').value, selectedGroup === ALL_GROUPS ? null : selectedGroup, selectedColor)
        syncExpandToggle(shown)
        if (shown.length) {
          $('cards').replaceChildren(...shown.map(card))
          return
        }
        const empty = document.createElement('p')
        empty.className = 'empty'
        empty.textContent = query.trim() || selectedColor ? '조건에 맞는 메모가 없습니다.' : '메모가 없습니다. + 버튼으로 추가하세요.'
        $('cards').replaceChildren(empty)
      }

      const groupEntries = (withAll) => [...(withAll ? [[ALL_GROUPS, '모든 그룹']] : []), ['', '기본'], ...groups.map((group) => [group.id, group.name])]

      function groupOptions(select) {
        select.replaceChildren(...groupEntries(false).map(([value, name]) => new Option(name, value)))
      }

      // 선택한 그룹이 지워졌으면 모든 그룹을 보여 준다.
      function renderGroups(selected = selectedGroup) {
        const entries = groupEntries(true)
        const counts = countByGroup(notes)
        const previous = selectedGroup
        selectedGroup = entries.some(([value]) => value === selected) ? selected : ALL_GROUPS
        // 패널을 다시 열면 마지막으로 보던 그룹을 보여 준다.
        if (selectedGroup !== previous) orca.storage.set('selectedGroup', selectedGroup).catch(() => showError('설정을 저장하지 못했습니다.'))
        $('group').replaceChildren(
          ...entries.map(([value, name]) => {
            const tab = document.createElement('button')
            tab.className = 'tab'
            tab.dataset.group = value
            tab.draggable = value !== ALL_GROUPS && value !== ''
            const count = value === ALL_GROUPS ? counts.all : (counts[value] ?? 0)
            tab.textContent = name
            const badge = document.createElement('span')
            badge.className = 'tab-count'
            badge.textContent = String(count)
            tab.append(badge)
            tab.title = `${name} (${count})`
            tab.setAttribute('aria-pressed', String(value === selectedGroup))
            return tab
          })
        )
        const fixed = selectedGroup === ALL_GROUPS || selectedGroup === ''
        $('group-rename').disabled = fixed
        $('group-delete').disabled = fixed
      }

      function moveNote(id, group) {
        const note = notes.find((candidate) => candidate.id === id)
        if (!note || note.group === group) return
        note.group = group
        note.updatedAt = Date.now()
        flush()
        renderGroups()
        renderList()
        showStatus(`'${groupEntries(false).find(([value]) => value === group)[1]}' 그룹으로 옮겼습니다.`)
      }

      // 이름을 바꿀 그룹. null이면 새 그룹을 만든다.
      let editingGroup = null

      function editGroup(group) {
        editingGroup = group
        $('group-edit').hidden = false
        $('group-name').value = group?.name ?? ''
        $('group-name').focus()
        $('group-name').select()
      }

      function closeGroupEdit() {
        $('group-edit').hidden = true
      }

      function confirmDeleteGroup() {
        closeGroupEdit()
        const name = groups.find((group) => group.id === selectedGroup)?.name
        const count = notes.filter((note) => note.group === selectedGroup).length
        $('group-confirm-text').textContent = `'${name}' 그룹을 삭제할까요?${count ? ` 메모 ${count}개는 '기본'으로 옮겨집니다.` : ''}`
        $('group-confirm').showModal() // 실수로 Enter를 눌러도 지워지지 않게 취소에 포커스가 간다(autofocus).
      }

      function saveGroup() {
        const name = $('group-name').value.trim()
        if (!name) return
        let selected = editingGroup?.id
        if (editingGroup) editingGroup.name = name
        else {
          const group = newGroup(name)
          groups.push(group)
          selected = group.id
        }
        closeGroupEdit()
        flush()
        renderGroups(selected)
        renderList()
      }

      function deleteGroup() {
        closeGroupEdit()
        const id = selectedGroup
        deletedGroups[id] = Date.now()
        groups = groups.filter((group) => group.id !== id)
        ungroupOrphans(notes, groups) // 메모는 지우지 않고 '기본'으로 옮긴다.
        flush()
        renderGroups('')
        renderList()
        showStatus("그룹을 삭제하고 메모를 '기본'으로 옮겼습니다.")
      }

      function renderSwatches() {
        for (const swatch of $('swatches').children) {
          swatch.setAttribute('aria-pressed', String(swatch.dataset.color === current.color))
        }
        $('note').style.setProperty('--c', COLORS[current.color])
      }

      function togglePalette(open) {
        $('swatches').hidden = !open
        $('palette').setAttribute('aria-expanded', String(open))
      }

      function emojiButton(glyph, name) {
        const button = document.createElement('button')
        button.textContent = glyph
        button.setAttribute('aria-label', name)
        return button
      }

      function emojiSection(name, buttons) {
        const section = document.createElement('section')
        const heading = document.createElement('h2')
        heading.textContent = name
        const grid = document.createElement('div')
        grid.className = 'emoji-grid'
        grid.append(...buttons)
        section.append(heading, grid)
        return section
      }

      const tonedEmoji = (entry) => entry.s?.[emojiTone - 1] ?? entry.e

      function showEmojiPreview(button) {
        $('emoji-preview-glyph').textContent = button?.textContent ?? '😊'
        $('emoji-preview-name').textContent = button?.getAttribute('aria-label') ?? '기분이 어떠세요?'
      }

      function renderRecentEmojis() {
        emojiSections[0].querySelector('.emoji-grid').replaceChildren(...recentEmojis.map((emoji) => emojiButton(emoji, emojiNames.get(emoji) ?? emoji)))
      }

      function syncEmojiTab() {
        const top = $('emoji-sections').scrollTop + 1
        const active = emojiSections.findLastIndex((section) => !section.hidden && section.offsetTop <= top)
        for (const [index, tab] of [...$('emoji-tabs').children].entries()) tab.setAttribute('aria-pressed', String(index === active))
      }

      function filterEmojis() {
        const query = $('emoji-query').value
        for (const { button, entry } of emojiCells) button.hidden = !matchesEmoji(entry, query)
        // 자주 사용은 아래 분류와 겹쳐서 검색 결과에 넣지 않는다.
        emojiSections[0].hidden = Boolean(query.trim())
        for (const section of emojiSections.slice(1)) section.hidden = !section.querySelector('button:not([hidden])')
        $('emoji-empty').hidden = emojiSections.some((section) => !section.hidden)
        $('emoji-sections').scrollTop = 0
        syncEmojiTab()
      }

      function setEmojiTone(tone) {
        emojiTone = tone
        for (const [index, swatch] of [...$('tones').children].entries()) swatch.setAttribute('aria-pressed', String(index === tone))
        for (const { button, entry } of emojiCells) button.textContent = tonedEmoji(entry)
      }

      function buildEmojis() {
        emojiSections = [
          emojiSection('자주 사용', []),
          ...EMOJI_GROUPS.map(({ name, emojis }) => {
            const cells = emojis.map((entry) => ({ button: emojiButton(tonedEmoji(entry), entry.n), entry }))
            emojiCells.push(...cells)
            return emojiSection(name, cells.map((cell) => cell.button))
          })
        ]
        for (const { e, n, s = [] } of EMOJI_GROUPS.flatMap((group) => group.emojis)) {
          for (const glyph of [e, ...s]) emojiNames.set(glyph, n)
        }
        $('emoji-sections').append(...emojiSections)
        for (const [index, section] of emojiSections.entries()) {
          const tab = document.createElement('button')
          tab.className = 'icon'
          tab.title = section.firstChild.textContent
          tab.setAttribute('aria-label', tab.title)
          tab.innerHTML = `<svg viewBox="0 0 20 20">${EMOJI_TAB_ICONS[index]}</svg>`
          tab.addEventListener('click', () => {
            $('emoji-query').value = ''
            filterEmojis()
            $('emoji-sections').scrollTop = section.offsetTop
          })
          $('emoji-tabs').append(tab)
        }
      }

      // 선택창은 하나를 제목과 본문이 함께 쓴다. 본문은 선택창을 열면 포커스를 잃으므로 커서 위치를 기억해 둔다.
      let emojiTarget = title
      let editorRange = null

      function toggleEmojis(open, target = title) {
        $('emojis').hidden = !open
        $('emoji').setAttribute('aria-expanded', String(open && target === title))
        $('format-emoji').setAttribute('aria-expanded', String(open && target === editor))
        $('tones').classList.remove('open')
        if (!open) return
        emojiTarget = target
        if (target === editor) {
          const range = getSelection().rangeCount ? getSelection().getRangeAt(0) : null
          editorRange = range && editor.contains(range.commonAncestorContainer) ? range.cloneRange() : null
        }
        if (!emojiSections.length) buildEmojis()
        renderRecentEmojis()
        showEmojiPreview()
        $('emoji-query').value = ''
        filterEmojis()
        $('emoji-query').focus()
      }

      function openNote(note) {
        current = note
        title.value = note.title
        editor.innerHTML = note.html
        groupOptions($('note-group'))
        $('note-group').value = note.group
        $('pin').setAttribute('aria-pressed', String(note.pinned))
        togglePalette(false)
        toggleEmojis(false)
        $('confirm').hidden = true
        renderSwatches()
        $('list').hidden = true
        $('note').hidden = false
        // 새 메모는 제목부터, 기존 메모는 본문부터 입력한다.
        if (persistable([note]).length) editor.focus()
        else title.focus()
      }

      function closeNote() {
        current = null
        notes = persistable(notes)
        flush()
        renderGroups()
        renderList()
        $('note').hidden = true
        $('list').hidden = false
      }

      function undoDelete() {
        if (!lastDeleted) return
        const restored = { ...lastDeleted, updatedAt: Date.now() }
        delete deletedNotes[restored.id]
        lastDeleted = null
        notes.push(restored)
        flush()
        renderGroups()
        renderList()
        showStatus('삭제를 취소했습니다.')
      }

      function deleteCurrent() {
        const removed = current
        const hadContent = removed && persistable([removed]).length > 0
        if (hadContent) {
          deletedNotes[removed.id] = Date.now()
          lastDeleted = { ...removed }
        }
        notes = notes.filter((note) => note !== removed)
        closeNote()
        if (hadContent) showStatus('메모를 삭제했습니다.', { label: '실행 취소', onClick: undoDelete })
      }

      function duplicateCurrent() {
        if (!current) return
        const copy = duplicateNote(current)
        notes.push(copy)
        flush()
        renderGroups()
        openNote(copy)
      }

      function currentChecklist() {
        const selection = getSelection()
        if (!selection.rangeCount) return null
        const node = selection.anchorNode
        const element = node?.nodeType === 1 ? node : node?.parentElement
        return element?.closest?.('#editor ul[data-checklist]') ?? null
      }

      function toggleChecklist() {
        editor.focus()
        const existing = currentChecklist()
        if (existing) {
          existing.removeAttribute('data-checklist')
          for (const item of existing.querySelectorAll('li')) item.removeAttribute('data-checked')
        } else {
          const selection = getSelection()
          const node = selection.anchorNode
          const element = node?.nodeType === 1 ? node : node?.parentElement
          let list = element?.closest?.('#editor ul')
          if (!list) {
            document.execCommand('insertUnorderedList')
            const nextNode = getSelection().anchorNode
            const nextElement = nextNode?.nodeType === 1 ? nextNode : nextNode?.parentElement
            list = nextElement?.closest?.('#editor ul')
          }
          if (list) {
            list.setAttribute('data-checklist', '1')
            for (const item of list.querySelectorAll('li')) {
              if (!item.hasAttribute('data-checked')) item.setAttribute('data-checked', 'false')
            }
          }
        }
        editor.dispatchEvent(new Event('input'))
        syncFormatButtons()
      }

      function syncFormatButtons() {
        // 제목은 글꼴이 굵어서 커서가 거기 있으면 '굵게'가 켜진 것으로 읽힌다.
        const inEditor = document.activeElement === editor
        for (const button of document.querySelectorAll('[data-command]')) {
          button.setAttribute('aria-pressed', String(inEditor && document.queryCommandState(button.dataset.command)))
        }
        $('format-check').setAttribute('aria-pressed', String(inEditor && Boolean(currentChecklist())))
      }

      async function load() {
        showError(null)
        try {
          const [stored, storedGroups, storedDeletedNotes, storedDeletedGroups, confirmSetting, rememberSetting, storedExpanded, recent, tone, lastGroup] = await Promise.all([
            orca.storage.get('notes'),
            orca.storage.get('groups'),
            orca.storage.get('deletedNotes'),
            orca.storage.get('deletedGroups'),
            orca.storage.get('confirmDelete'),
            orca.storage.get('rememberExpanded'),
            orca.storage.get('expandedIds'),
            orca.storage.get('recentEmojis'),
            orca.storage.get('emojiTone'),
            orca.storage.get('selectedGroup')
          ])
          deletedNotes = pruneDeleted(storedDeletedNotes)
          deletedGroups = pruneDeleted(storedDeletedGroups)
          groups = Array.isArray(storedGroups) ? storedGroups.filter((group) => !deletedGroups[group.id]) : []
          notes = ungroupOrphans(
            Array.isArray(stored) ? withDefaults(stored).filter((note) => !(deletedNotes[note.id] >= note.updatedAt)) : [],
            groups
          )
          confirmDelete = confirmSetting ?? true
          rememberExpanded = rememberSetting ?? false
          expanded.clear()
          if (rememberExpanded && Array.isArray(storedExpanded)) {
            for (const id of storedExpanded) expanded.add(id)
          }
          recentEmojis = recent ?? DEFAULT_EMOJIS
          selectedGroup = lastGroup ?? ALL_GROUPS
          setEmojiTone(tone ?? 0)
          loaded = true
          for (const id of ['add', 'backup', 'import', 'group-add']) $(id).disabled = false
          $('confirm-setting').checked = confirmDelete
          $('remember-expanded').checked = rememberExpanded
          renderColorFilter()
          renderGroups()
          renderList()
          orca.storage.onDidChange?.(() => void syncFromStorage())
        } catch {
          showError('메모를 불러오지 못했습니다.', load)
        }
      }

      for (const [name, value] of Object.entries(COLORS)) {
        const swatch = document.createElement('button')
        swatch.className = 'swatch'
        swatch.dataset.color = name
        swatch.style.setProperty('--c', value)
        swatch.setAttribute('aria-label', `색상 ${name}`)
        swatch.addEventListener('click', () => {
          current.color = name
          current.updatedAt = Date.now()
          renderSwatches()
          scheduleSave()
        })
        $('swatches').append(swatch)
      }

      for (const [index, [name, color]] of SKIN_TONES.entries()) {
        const swatch = document.createElement('button')
        swatch.className = 'tone'
        swatch.title = `피부색: ${name}`
        swatch.setAttribute('aria-label', swatch.title)
        swatch.setAttribute('aria-pressed', String(index === 0))
        swatch.style.setProperty('--c', color)
        swatch.addEventListener('click', () => {
          // 닫혀 있으면 고른 색 하나만 보이고, 누르면 나머지가 펼쳐진다.
          const open = $('tones').classList.toggle('open')
          if (open) return
          setEmojiTone(index)
          orca.storage.set('emojiTone', index).catch(() => showError('설정을 저장하지 못했습니다.'))
        })
        $('tones').append(swatch)
      }

      $('emoji-sections').addEventListener('click', (event) => {
        const emoji = event.target.closest('button')?.textContent
        if (!emoji) return
        if (emojiTarget === editor) {
          editor.focus()
          const selection = getSelection()
          if (!editorRange) {
            editorRange = document.createRange()
            editorRange.selectNodeContents(editor)
            editorRange.collapse(false) // 커서를 둔 적이 없으면 끝에 넣는다.
          }
          selection.removeAllRanges()
          selection.addRange(editorRange)
          document.execCommand('insertText', false, emoji) // input 이벤트가 발생해 저장된다.
        } else {
          title.setRangeText(emoji, title.selectionStart, title.selectionEnd, 'end')
          title.dispatchEvent(new Event('input')) // 저장은 직접 입력과 같은 경로를 탄다.
        }
        recentEmojis = pushRecent(recentEmojis, emoji)
        orca.storage.set('recentEmojis', recentEmojis).catch(() => showError('설정을 저장하지 못했습니다.'))
        toggleEmojis(false)
        emojiTarget.focus()
      })
      for (const name of ['mouseover', 'focusin']) {
        $('emoji-sections').addEventListener(name, (event) => showEmojiPreview(event.target.closest('button')))
      }
      $('emoji-sections').addEventListener('mouseleave', () => showEmojiPreview())
      $('emoji-sections').addEventListener('scroll', syncEmojiTab)
      $('emoji-query').addEventListener('input', filterEmojis)
      $('emojis').addEventListener('keydown', (event) => {
        if (event.isComposing || event.key !== 'Escape') return
        event.preventDefault()
        toggleEmojis(false)
        emojiTarget.focus()
      })

      for (const id of ['add', 'backup', 'import', 'group-add']) $(id).disabled = true
      $('backup').addEventListener('click', backup)
      $('import').addEventListener('click', () => $('import-file').click())
      $('import-file').addEventListener('change', async (event) => {
        await importBackup(event.target.files[0])
        event.target.value = '' // 같은 파일을 다시 고를 수 있게 한다.
      })
      $('add').addEventListener('click', () => {
        const note = newNote(Date.now(), selectedGroup === ALL_GROUPS ? '' : selectedGroup)
        notes.push(note)
        openNote(note)
      })
      $('gear').addEventListener('click', () => {
        const open = $('settings').hidden
        $('settings').hidden = !open
        $('gear').setAttribute('aria-expanded', String(open))
      })
      $('status-action').addEventListener('click', () => {
        const handler = statusActionHandler
        statusActionHandler = null
        $('status').hidden = true
        handler?.()
      })
      $('confirm-setting').addEventListener('change', (event) => {
        confirmDelete = event.target.checked
        orca.storage.set('confirmDelete', confirmDelete).catch(() => showError('설정을 저장하지 못했습니다.'))
      })
      $('remember-expanded').addEventListener('change', (event) => {
        rememberExpanded = event.target.checked
        orca.storage.set('rememberExpanded', rememberExpanded).catch(() => showError('설정을 저장하지 못했습니다.'))
        orca.storage.set('expandedIds', rememberExpanded ? [...expanded] : []).catch(() => showError('설정을 저장하지 못했습니다.'))
      })
      $('toggle-expand').addEventListener('click', () => {
        const shown = visibleNotes(notes, $('query').value, $('scope').value, selectedGroup === ALL_GROUPS ? null : selectedGroup, selectedColor)
        const collapsible = shown.filter((note) => note.title.trim() && note.text.trim())
        const anyOpen = collapsible.some((note) => expanded.has(note.id))
        if (anyOpen) {
          for (const note of collapsible) expanded.delete(note.id)
        } else {
          for (const note of collapsible) expanded.add(note.id)
        }
        saveExpanded()
        renderList()
      })
      $('cards').addEventListener('mouseover', (event) => {
        // 복사·적용·실행 버튼에는 자체 툴팁이 있다.
        const header = event.target.closest('.apply, .card-copy') ? null : event.target.closest('.card-top')
        if (header === tipHeader) return
        hideTip()
        tipHeader = header
        if (header) tipTimer = setTimeout(() => showTip(header), TIP_DELAY_MS)
      })
      for (const name of ['mouseleave', 'click', 'scroll']) $('cards').addEventListener(name, hideTip)
      $('query').addEventListener('input', renderList)
      $('query').addEventListener('keydown', (event) => {
        if (event.isComposing || event.key !== 'Escape') return
        $('query').value = ''
        renderList()
        $('query').blur()
      })
      $('scope').addEventListener('change', renderList)
      $('group').addEventListener('click', (event) => {
        const tab = event.target.closest('.tab')
        if (!tab) return
        closeGroupEdit()
        renderGroups(tab.dataset.group)
        renderList()
      })
      // 사용자 정의 그룹 탭끼리 끌어 순서를 바꾼다.
      const isCustomTab = (tab) => tab && tab.dataset.group !== ALL_GROUPS && tab.dataset.group !== ''
      $('group').addEventListener('dragstart', (event) => {
        const tab = event.target.closest('.tab')
        if (!isCustomTab(tab)) return
        tab.classList.add('dragging')
        event.dataTransfer.setData(GROUP_DRAG_TYPE, tab.dataset.group)
        event.dataTransfer.effectAllowed = 'move'
      })
      // 메모 카드를 그룹 탭에 끌어 놓으면 그 그룹으로 옮긴다. '모든 그룹'은 놓을 곳이 아니다.
      const dropTab = (event) => {
        const tab = event.target.closest('.tab')
        return tab && tab.dataset.group !== ALL_GROUPS && event.dataTransfer.types.includes(NOTE_DRAG_TYPE) ? tab : null
      }
      $('group').addEventListener('dragover', (event) => {
        if (event.dataTransfer.types.includes(GROUP_DRAG_TYPE)) {
          const dragging = $('group').querySelector('.tab.dragging')
          const target = event.target.closest('.tab')
          if (!dragging || !isCustomTab(target)) return
          event.preventDefault()
          event.dataTransfer.dropEffect = 'move'
          if (target === dragging) return
          const { left, width } = target.getBoundingClientRect()
          if (event.clientX > left + width / 2) target.after(dragging)
          else target.before(dragging)
          return
        }
        const tab = dropTab(event)
        for (const other of $('group').children) other.classList.toggle('drop', other === tab)
        if (!tab) return
        event.preventDefault()
        event.dataTransfer.dropEffect = 'move'
      })
      $('group').addEventListener('dragleave', (event) => {
        if (!$('group').contains(event.relatedTarget)) for (const tab of $('group').children) tab.classList.remove('drop')
      })
      $('group').addEventListener('drop', (event) => {
        if (event.dataTransfer.types.includes(GROUP_DRAG_TYPE)) {
          const dragging = $('group').querySelector('.tab.dragging')
          if (!dragging) return
          event.preventDefault()
          const ids = [...$('group').children].filter(isCustomTab).map((tab) => tab.dataset.group)
          groups = reorderGroups(groups, ids)
          flush()
          renderGroups()
          return
        }
        const tab = dropTab(event)
        for (const other of $('group').children) other.classList.remove('drop')
        if (!tab) return
        event.preventDefault()
        moveNote(event.dataTransfer.getData(NOTE_DRAG_TYPE), tab.dataset.group)
      })
      $('group').addEventListener('dragend', () => {
        renderGroups()
      })
      $('cards').addEventListener('dragstart', (event) => {
        const element = event.target.closest('.card')
        if (!element) return
        hideTip()
        element.classList.add('dragging')
        event.dataTransfer.setData(NOTE_DRAG_TYPE, element.dataset.id)
        event.dataTransfer.effectAllowed = 'move'
      })
      // 같은 그룹, 같은 고정 여부의 메모끼리만 끌어서 순서를 바꾼다. 끄는 동안 카드를 옮겨 미리 보여 준다.
      const noteOf = (element) => notes.find((note) => note.id === element.dataset.id)
      const sameSection = (a, b) => a.group === b.group && a.pinned === b.pinned
      $('cards').addEventListener('dragover', (event) => {
        const dragging = $('cards').querySelector('.dragging')
        const target = event.target.closest('.card')
        if (!dragging || !target || !sameSection(noteOf(dragging), noteOf(target))) return
        event.preventDefault()
        event.dataTransfer.dropEffect = 'move'
        if (target === dragging) return
        const { top, height } = target.getBoundingClientRect()
        if (event.clientY > top + height / 2) target.after(dragging)
        else target.before(dragging)
      })
      $('cards').addEventListener('drop', (event) => {
        const dragging = $('cards').querySelector('.dragging')
        if (!dragging) return
        event.preventDefault()
        const note = noteOf(dragging)
        const ids = [...$('cards').children].filter((element) => sameSection(noteOf(element), note)).map((element) => element.dataset.id)
        reorder(notes, ids)
        flush()
      })
      // 놓지 않고 취소했으면 미리 옮긴 카드를 되돌린다.
      $('cards').addEventListener('dragend', () => {
        for (const tab of $('group').children) tab.classList.remove('drop')
        renderList()
      })
      $('group-add').addEventListener('click', () => editGroup(null))
      $('group-rename').addEventListener('click', () => editGroup(groups.find((group) => group.id === selectedGroup)))
      $('group-delete').addEventListener('click', confirmDeleteGroup)
      $('group-confirm-yes').addEventListener('click', () => {
        $('group-confirm').close()
        deleteGroup()
      })
      $('group-confirm-no').addEventListener('click', () => $('group-confirm').close())
      // Esc는 dialog가 스스로 닫는다. 바깥 어두운 영역을 눌러도 취소한다.
      $('group-confirm').addEventListener('click', (event) => {
        if (event.target === $('group-confirm')) $('group-confirm').close()
      })
      $('group-edit').addEventListener('submit', (event) => {
        event.preventDefault()
        saveGroup()
      })
      $('group-cancel').addEventListener('click', closeGroupEdit)
      $('group-name').addEventListener('keydown', (event) => {
        if (event.key === 'Escape') closeGroupEdit()
      })
      $('note-group').addEventListener('change', (event) => {
        current.group = event.target.value
        current.updatedAt = Date.now()
        scheduleSave()
      })

      $('back').addEventListener('click', closeNote)
      $('pin').addEventListener('click', () => {
        current.pinned = !current.pinned
        current.updatedAt = Date.now()
        delete current.order // 끌어서 정한 순서는 고정 여부별 목록 안에서만 의미가 있다.
        $('pin').setAttribute('aria-pressed', String(current.pinned))
        scheduleSave()
      })
      $('duplicate').addEventListener('click', duplicateCurrent)
      $('palette').addEventListener('click', () => togglePalette($('swatches').hidden))
      $('emoji').addEventListener('click', () => toggleEmojis($('emojis').hidden || emojiTarget !== title, title))
      $('format-check').addEventListener('mousedown', (event) => event.preventDefault()) // 편집기 선택 영역 유지
      $('format-check').addEventListener('click', toggleChecklist)
      $('format-emoji').addEventListener('mousedown', (event) => event.preventDefault()) // 편집기 선택 영역 유지
      $('format-emoji').addEventListener('click', () => toggleEmojis($('emojis').hidden || emojiTarget !== editor, editor))
      $('delete').addEventListener('click', () => {
        if (confirmDelete && persistable([current]).length) $('confirm').hidden = false
        else deleteCurrent()
      })
      $('confirm-yes').addEventListener('click', deleteCurrent)
      $('confirm-no').addEventListener('click', () => {
        $('confirm').hidden = true
      })

      title.addEventListener('input', () => {
        current.title = title.value
        current.updatedAt = Date.now()
        scheduleSave()
      })
      title.addEventListener('keydown', (event) => {
        if (event.isComposing) return // 한글 조합을 확정하는 Enter로 본문으로 넘어가지 않게 한다.
        if (event.key === 'Enter') editor.focus()
        if (event.key === 'Escape') closeNote()
      })

      editor.addEventListener('input', () => {
        // 내용을 모두 지워도 브라우저가 <br>을 남겨서 안내 문구가 보이지 않는다.
        if (!editor.textContent && !editor.querySelector('li')) editor.innerHTML = ''
        // 체크된 항목에서 Enter로 만든 새 빈 항목은 체크 해제 상태로 시작한다.
        for (const item of editor.querySelectorAll('ul[data-checklist] li')) {
          if (!item.hasAttribute('data-checked') || (item.dataset.checked === 'true' && !item.textContent.trim())) {
            item.dataset.checked = 'false'
          }
        }
        current.html = editor.innerHTML
        current.text = editor.innerText
        current.updatedAt = Date.now()
        scheduleSave()
      })
      editor.addEventListener('click', (event) => {
        const item = event.target.closest('ul[data-checklist] li')
        if (!item || event.clientX - item.getBoundingClientRect().left > 20) return
        event.preventDefault()
        item.dataset.checked = item.dataset.checked === 'true' ? 'false' : 'true'
        editor.dispatchEvent(new Event('input'))
      })
      editor.addEventListener('paste', (event) => {
        event.preventDefault()
        document.execCommand('insertText', false, event.clipboardData.getData('text/plain'))
      })
      editor.addEventListener('drop', (event) => event.preventDefault())
      editor.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') closeNote()
      })

      for (const button of document.querySelectorAll('[data-command]')) {
        button.addEventListener('mousedown', (event) => event.preventDefault()) // 편집기 선택 영역 유지
        button.addEventListener('click', () => {
          editor.focus()
          document.execCommand(button.dataset.command)
          syncFormatButtons()
        })
      }
      document.addEventListener('selectionchange', () => {
        if (current) syncFormatButtons()
      })
      document.addEventListener('keydown', (event) => {
        if (event.isComposing || document.querySelector('dialog[open]')) return
        const mod = event.ctrlKey || event.metaKey
        const key = event.key.toLowerCase()
        if (!$('note').hidden) {
          if (mod && key === 'd') {
            event.preventDefault()
            duplicateCurrent()
          }
          return
        }
        if (mod && (key === 'f' || key === 'k')) {
          event.preventDefault()
          $('query').focus()
          $('query').select()
          return
        }
        const active = document.activeElement
        const typing = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT' || active.isContentEditable)
        if (typing || mod || event.altKey) return
        if (event.key === '/') {
          event.preventDefault()
          $('query').focus()
        } else if (key === 'n' && !$('add').disabled) {
          event.preventDefault()
          $('add').click()
        }
      })

      // 패널이 닫힐 때 대기 중인 저장만 마친다. 변경이 없으면 쓰지 않아야 다른 곳의 저장을 덮어쓰지 않는다.
      const flushPending = () => {
        if (saveTimer !== null) flush()
      }
      addEventListener('pagehide', flushPending)
      addEventListener('focus', () => {
        if (!loaded) return
        void syncFromStorage()
      })
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) flushPending()
        else if (loaded) void syncFromStorage()
      })

      void load()
    </script>
  </body>
</html>
