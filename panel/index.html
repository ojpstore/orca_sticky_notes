<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>스티커 메모</title>
    <style>
      * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--orca-border) transparent; }
      [hidden] { display: none !important; }
      html, body { height: 100%; }
      :root { --radius: var(--orca-radius, 6px); }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        font: 13px/1.55 system-ui, 'Segoe UI', 'Malgun Gothic', sans-serif;
        color: var(--orca-foreground);
        background: var(--orca-background);
      }
      button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
      :focus-visible { outline: 2px solid var(--orca-ring); outline-offset: -1px; }
      svg { display: block; width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

      .view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      .bar { display: flex; align-items: center; flex: none; }
      .spacer { flex: 1; }
      .icon { width: 28px; height: 28px; display: grid; place-items: center; color: var(--orca-muted-foreground); border-radius: var(--radius); }
      .icon:hover, .icon[aria-expanded='true'], .icon[aria-pressed='true'] { background: var(--orca-accent); color: var(--orca-accent-foreground); }
      .icon:disabled { opacity: 0.5; cursor: default; }

      .banner { flex: none; margin: 0; padding: 6px 12px; font-size: 12px; color: var(--orca-destructive-foreground); background: var(--orca-destructive); }
      .banner button { text-decoration: underline; }

      .header { gap: 2px; padding: 8px 8px 8px 12px; }
      h1 { flex: 1; min-width: 0; margin: 0; font-size: 14px; font-weight: 600; }
      .settings { margin: 0 12px 10px; padding: 8px 10px; font-size: 12px; border: 1px solid var(--orca-border); border-radius: var(--radius); }
      .settings label { display: flex; align-items: center; gap: 8px; cursor: pointer; }

      .filter { display: flex; gap: 6px; flex: none; margin: 0 12px 10px; }
      #scope, .search input {
        height: 30px;
        font: inherit;
        color: inherit;
        background: transparent;
        border: 1px solid var(--orca-input);
        border-radius: var(--radius);
      }
      #scope { flex: none; padding: 0 4px; }
      #scope option { color: var(--orca-popover-foreground); background: var(--orca-popover); }
      .search { position: relative; flex: 1; min-width: 0; }
      .search input { width: 100%; padding: 0 30px 0 10px; }
      .search input::placeholder { color: var(--orca-muted-foreground); }
      .search input::-webkit-search-cancel-button { display: none; }
      .search svg { position: absolute; top: 7px; right: 8px; color: var(--orca-muted-foreground); pointer-events: none; }

      .list-tools { justify-content: flex-end; gap: 2px; margin: -6px 12px 4px; }

      .cards { flex: 1; min-height: 0; overflow-y: auto; padding: 0 12px 12px; display: flex; flex-direction: column; gap: 8px; }
      .card {
        flex: none;
        overflow: hidden;
        color: var(--orca-card-foreground);
        background: var(--orca-card);
        border: 1px solid var(--orca-border);
        border-radius: var(--radius);
      }
      .card::before { content: ''; display: block; height: 2px; background: var(--c); }
      .card:has(.card-body:hover) { border-color: var(--orca-input); }
      .card-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 2px 8px; min-height: 34px; padding: 4px 8px 4px 12px; }
      .card-title { flex: 1 1 96px; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .card-title[aria-expanded] { cursor: pointer; }
      .card-title[aria-expanded]::before { content: '▸'; display: inline-block; width: 14px; color: var(--orca-muted-foreground); }
      .card-title[aria-expanded='true']::before { content: '▾'; }
      .card-pin { flex: none; width: 13px; height: 13px; margin-right: auto; color: var(--c); }
      .card-title .card-pin { display: inline-block; margin-right: 5px; vertical-align: -2px; }
      .date { flex: none; font-size: 11px; color: var(--orca-muted-foreground); }
      .apply {
        flex: none;
        height: 22px;
        padding: 0 8px;
        font-size: 11px;
        font-weight: 500;
        white-space: nowrap;
        color: var(--orca-foreground);
        border: 1px solid color-mix(in srgb, var(--orca-foreground) 35%, transparent);
        border-radius: var(--radius);
      }
      .apply:hover:not(:disabled) { color: var(--orca-primary-foreground); background: var(--orca-primary); border-color: var(--orca-primary); }
      .apply:disabled { opacity: 0.6; cursor: default; }
      .card-top.divided + .card-body { border-top: 1px solid var(--orca-border); margin: 0 12px; padding: 8px 0 10px; }
      .card-body { min-height: 24px; padding: 0 12px 10px; cursor: pointer; } /* 제목만 있는 메모도 누를 영역이 남아야 한다. */
      .preview:empty { display: none; }
      .preview { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5; overflow: hidden; overflow-wrap: anywhere; color: var(--orca-muted-foreground); }
      .card-top:not(.divided) + .card-body .preview { color: inherit; }
      .empty { margin: 24px 0; text-align: center; color: var(--orca-muted-foreground); }
      .status { flex: none; margin: 0; padding: 6px 12px; font-size: 12px; color: var(--orca-muted-foreground); border-top: 1px solid var(--orca-border); }
      #tip {
        position: fixed;
        left: 0;
        right: 0;
        z-index: 1;
        max-height: 50vh;
        overflow: hidden;
        padding: 6px 12px;
        font-size: 12px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        pointer-events: none;
        color: var(--orca-popover-foreground);
        background: var(--orca-popover);
        border: 1px solid var(--orca-border);
        border-radius: var(--radius);
      }
      .footer { justify-content: flex-end; gap: 6px; padding: 6px 12px; border-top: 1px solid var(--orca-border); }
      .footer .apply { display: flex; align-items: center; gap: 4px; height: 26px; font-size: 12px; }
      .footer svg { width: 13px; height: 13px; }

      .preview ul, #editor ul { margin: 0; padding-left: 1.3em; }

      #note { border-top: 2px solid var(--c); }
      #note > .bar:first-child { gap: 2px; padding: 6px 8px; }
      #swatches { gap: 8px; padding: 4px 12px 8px; }
      .swatch { width: 18px; height: 18px; padding: 0; background: var(--c); border-radius: 50%; }
      .swatch[aria-pressed='true'] { box-shadow: 0 0 0 2px var(--orca-background), 0 0 0 3px var(--orca-foreground); }
      #confirm { gap: 6px; margin: 0 8px 6px; padding: 6px 8px 6px 10px; font-size: 12px; border: 1px solid var(--orca-border); border-radius: var(--radius); }
      #confirm button { height: 24px; padding: 0 10px; border-radius: var(--radius); color: var(--orca-secondary-foreground); background: var(--orca-secondary); }
      #confirm #confirm-yes { color: var(--orca-destructive-foreground); background: var(--orca-destructive); }
      .title-row { gap: 2px; padding-right: 8px; border-bottom: 1px solid var(--orca-border); }
      #title {
        flex: 1;
        min-width: 0;
        padding: 6px 4px 8px 12px;
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        color: inherit;
        background: none;
        border: 0;
        outline: none;
      }
      #title::placeholder { color: var(--orca-muted-foreground); font-weight: 400; }
      #emojis { flex: none; display: flex; flex-direction: column; height: min(340px, 60vh); border-bottom: 1px solid var(--orca-border); }
      .emoji-search { gap: 8px; padding: 8px 10px 4px; }
      .tones { display: flex; flex: none; gap: 4px; }
      .tone { width: 16px; height: 16px; padding: 0; background: var(--c); border-radius: 4px; }
      .tones:not(.open) .tone[aria-pressed='false'] { display: none; }
      .tones.open .tone[aria-pressed='true'] { box-shadow: 0 0 0 1px var(--orca-background), 0 0 0 2px var(--orca-foreground); }
      #emoji-tabs { justify-content: space-between; padding: 0 6px 2px; border-bottom: 1px solid var(--orca-border); }
      #emoji-tabs .icon[aria-pressed='true'] { background: none; color: var(--orca-primary); }
      #emoji-sections { position: relative; flex: 1; min-height: 0; overflow-y: auto; padding: 0 10px 6px; }
      #emoji-sections h2 { position: sticky; top: 0; margin: 0; padding: 6px 0 2px; font-size: 12px; font-weight: 600; background: var(--orca-background); }
      .emoji-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(32px, 1fr)); }
      .emoji-grid button { height: 32px; padding: 0; font-size: 20px; line-height: 1; border-radius: var(--radius); }
      .emoji-grid button:hover { background: var(--orca-accent); }
      #emoji-preview { gap: 8px; height: 44px; padding: 0 12px; font-size: 12px; border-top: 1px solid var(--orca-border); }
      #emoji-preview-glyph { font-size: 26px; line-height: 1; }
      #emoji-preview-name { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #editor { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 12px; outline: none; overflow-wrap: anywhere; }
      #editor:empty::before { content: attr(data-placeholder); color: var(--orca-muted-foreground); }
      #format { gap: 2px; padding: 6px 8px; border-top: 1px solid var(--orca-border); }
      #format .icon { font-size: 13px; }
</style>
  </head>
  <body>
    <p id="error" class="banner" role="alert" hidden></p>

    <section id="list" class="view">
      <div class="bar header">
        <h1>스티커 메모</h1>
        <button id="add" class="icon" aria-label="새 메모" title="새 메모">
          <svg viewBox="0 0 20 20"><path d="M10 3v14M3 10h14" /></svg>
        </button>
        <button id="gear" class="icon" aria-label="설정" title="설정" aria-expanded="false">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-2.8 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.9l.1-.1a1.7 1.7 0 0 0-1.2-2.8H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.9-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.9l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" /></svg>
        </button>
      </div>
      <div id="settings" class="settings" hidden>
        <label><input id="confirm-setting" type="checkbox" /> 삭제하기 전에 확인</label>
      </div>
      <div class="filter">
        <select id="scope" aria-label="조회 조건">
          <option value="all">전체</option>
          <option value="title">제목</option>
          <option value="text">내용</option>
        </select>
        <div class="search">
          <input id="query" type="search" placeholder="검색..." aria-label="메모 검색" />
          <svg viewBox="0 0 20 20"><circle cx="9" cy="9" r="5.5" /><path d="m13 13 4 4" /></svg>
        </div>
      </div>
      <div class="bar list-tools">
        <button id="collapse-all" class="icon" aria-label="전체 접기" title="전체 접기">
          <svg viewBox="0 0 20 20"><path d="m6 3 4 4 4-4M6 17l4-4 4 4" /></svg>
        </button>
        <button id="expand-all" class="icon" aria-label="전체 펼치기" title="전체 펼치기">
          <svg viewBox="0 0 20 20"><path d="m6 7 4-4 4 4M6 13l4 4 4-4" /></svg>
        </button>
      </div>
      <div id="cards" class="cards"></div>
      <div id="tip" role="tooltip" hidden></div>
      <p id="status" class="status" role="status" hidden></p>
      <div class="bar footer">
        <button id="backup" class="apply" title="메모를 JSON 파일로 저장">
          <svg viewBox="0 0 20 20"><path d="M10 3v12m-5-5 5 5 5-5" /></svg>백업
        </button>
        <button id="import" class="apply" title="백업 파일의 메모를 현재 메모에 합치기">
          <svg viewBox="0 0 20 20"><path d="M10 17V5m-5 5 5-5 5 5" /></svg>임포트
        </button>
        <input id="import-file" type="file" accept=".json,application/json" aria-label="백업 파일" hidden />
      </div>
    </section>

    <section id="note" class="view" hidden>
      <div class="bar">
        <button id="back" class="icon" aria-label="메모 목록" title="메모 목록">
          <svg viewBox="0 0 20 20"><path d="M16 10H4m5-5-5 5 5 5" /></svg>
        </button>
        <span class="spacer"></span>
        <button id="pin" class="icon" aria-label="고정" title="고정" aria-pressed="false">
          <svg viewBox="0 0 20 20"><path d="M7 3h6M8 3v5.500L5.500 12h9L12 8.500V3M10 12v5" /></svg>
        </button>
        <button id="palette" class="icon" aria-label="색상" title="색상" aria-expanded="false">
          <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" /><circle cx="10" cy="10" r="2.5" fill="currentColor" /></svg>
        </button>
        <button id="delete" class="icon" aria-label="메모 삭제" title="메모 삭제">
          <svg viewBox="0 0 20 20"><path d="M3.5 5.5h13M8 5.5V3.5h4v2m-7 0 .8 11h8.4l.8-11M8.5 8.5v5m3-5v5" /></svg>
        </button>
      </div>
      <div id="swatches" class="bar" hidden></div>
      <div id="confirm" class="bar" hidden>
        <span class="spacer">이 메모를 삭제할까요?</span>
        <button id="confirm-yes">삭제</button>
        <button id="confirm-no">취소</button>
      </div>
      <div class="bar title-row">
        <input id="title" type="text" placeholder="제목" aria-label="메모 제목" autocomplete="off" />
        <button id="emoji" class="icon" aria-label="이모지" title="이모지" aria-expanded="false">
          <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" /><path d="M7 12c.7 1 1.7 1.5 3 1.5s2.300-.5 3-1.5M7.500 8h.01M12.500 8h.01" /></svg>
        </button>
      </div>
      <div id="emojis" role="group" aria-label="이모지 선택" hidden>
        <div class="bar emoji-search">
          <div class="search">
            <input id="emoji-query" type="search" placeholder="이모지 검색" aria-label="이모지 검색" autocomplete="off" />
            <svg viewBox="0 0 20 20"><circle cx="9" cy="9" r="5.5" /><path d="m13 13 4 4" /></svg>
          </div>
          <div id="tones" class="tones" role="group" aria-label="피부색"></div>
        </div>
        <div id="emoji-tabs" class="bar"></div>
        <div id="emoji-sections">
          <p id="emoji-empty" class="empty" hidden>검색 결과가 없습니다.</p>
        </div>
        <div id="emoji-preview" class="bar">
          <span id="emoji-preview-glyph"></span>
          <span id="emoji-preview-name"></span>
        </div>
      </div>
      <div id="editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="메모 내용" data-placeholder="메모 입력..."></div>
      <div id="format" class="bar">
        <button class="icon" data-command="bold" aria-label="굵게" aria-pressed="false" title="굵게 (Ctrl+B)"><b>B</b></button>
        <button class="icon" data-command="italic" aria-label="기울임꼴" aria-pressed="false" title="기울임꼴 (Ctrl+I)"><i>I</i></button>
        <button class="icon" data-command="underline" aria-label="밑줄" aria-pressed="false" title="밑줄 (Ctrl+U)"><u>U</u></button>
        <button class="icon" data-command="strikeThrough" aria-label="취소선" aria-pressed="false" title="취소선"><s>ab</s></button>
        <button class="icon" data-command="insertUnorderedList" aria-label="글머리 기호" aria-pressed="false" title="글머리 기호">
          <svg viewBox="0 0 20 20"><path d="M8 5h9M8 10h9M8 15h9M3.5 5h.01M3.5 10h.01M3.5 15h.01" stroke-width="2" /></svg>
        </button>
      </div>
    </section>

    <script type="module">
      import { EMOJI_GROUPS } from './emoji-data.js'
      import { backupJson, COLORS, DEFAULT_EMOJIS, formatDate, matchesEmoji, mergeNotes, newNote, parseBackup, persistable, pushRecent, visibleNotes, withDefaults } from './notes.js'

      const $ = (id) => document.getElementById(id)
      const editor = $('editor')
      const title = $('title')
      const SAVE_DELAY_MS = 300
      const RETRY_DELAY_MS = 3000
      const STATUS_MS = 4000
      const TIP_DELAY_MS = 400
      const TIP_GAP_PX = 4
      const NOTE_TAGS = new Set(['B', 'I', 'U', 'S', 'STRIKE', 'STRONG', 'EM', 'UL', 'OL', 'LI', 'DIV', 'P', 'BR', 'SPAN'])
      const SKIN_TONES = [
        ['기본', '#ffc83d'],
        ['하얀 피부', '#f7dece'],
        ['연한 갈색 피부', '#f3d2a2'],
        ['갈색 피부', '#d5ab88'],
        ['진한 갈색 피부', '#af7e57'],
        ['검은색 피부', '#7c533e']
      ]
      // 자주 사용, EMOJI_GROUPS 순서다.
      const EMOJI_TAB_ICONS = [
        '<circle cx="10" cy="10" r="7" /><path d="M10 6v4l3 2" />',
        '<circle cx="10" cy="10" r="7" /><path d="M7 12c.7 1 1.7 1.5 3 1.5s2.3-.5 3-1.5M7.5 8h.01M12.5 8h.01" />',
        '<path d="M4 3.5 7.5 6h5L16 3.5V11a6 6 0 0 1-12 0zM8 10.5h.01M12 10.5h.01M9 13.5h2" />',
        '<path d="M3.5 9a6.5 6 0 0 1 13 0zM3 12h14M4 15h12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z" />',
        '<rect x="4" y="3" width="12" height="12" rx="2" /><path d="M4 10h12M7 15v2M13 15v2M7 12.5h.01M13 12.5h.01" />',
        '<circle cx="10" cy="10" r="7" /><path d="M5 5c3 3 3 7 0 10M15 5c-3 3-3 7 0 10" />',
        '<path d="M7 3 3 6l2 3 2-1v9h6V8l2 1 2-3-4-3c-.5 1.3-1.5 2-3 2s-2.5-.7-3-2z" />',
        '<path d="M8 15V5l8-2v10" /><circle cx="6" cy="15" r="2" /><circle cx="14" cy="13" r="2" />',
        '<path d="M5 17V3.5c3-1.5 5 1.5 10 0v8c-5 1.5-7-1.5-10 0" />'
      ]

      let notes = []
      let current = null
      let confirmDelete = true
      let recentEmojis = DEFAULT_EMOJIS
      let emojiTone = 0 // SKIN_TONES 위치. 0은 피부색 없는 기본 글자다.
      let emojiSections = [] // 처음 열 때 만든다. 글자 버튼이 2천 개 가까워서 메모만 보는 동안에는 만들지 않는다.
      const emojiCells = [] // { button, entry }
      const emojiNames = new Map()
      let loaded = false // 불러오기 전에는 절대 저장하지 않는다. 빈 목록으로 덮어쓰면 메모가 사라진다.
      let saveTimer = null
      let statusTimer = null
      let tipTimer = null
      let tipHeader = null
      const expanded = new Set() // 펼친 메모 id. 저장하지 않으므로 패널을 새로 열면 모두 접힌다.
      let writes = Promise.resolve()

      function showError(message, retry) {
        const banner = $('error')
        banner.hidden = !message
        banner.textContent = message ?? ''
        if (!retry) return
        const button = document.createElement('button')
        button.textContent = '다시 시도'
        button.addEventListener('click', retry)
        banner.append(' ', button)
      }

      // ponytail: 전체 배열을 한 키에 저장하며 마지막 쓰기가 이긴다. 패널을 두 창에서 동시에 열면 메모별 키와 onDidChange 병합이 필요하다.
      function flush() {
        clearTimeout(saveTimer)
        saveTimer = null
        if (!loaded) return
        const snapshot = persistable(notes)
        writes = writes.then(() => orca.storage.set('notes', snapshot)).then(
          () => showError(null),
          () => {
            showError('저장하지 못했습니다. 잠시 후 다시 시도합니다.')
            scheduleSave(RETRY_DELAY_MS)
          }
        )
      }

      function scheduleSave(delay = SAVE_DELAY_MS) {
        clearTimeout(saveTimer)
        saveTimer = setTimeout(flush, delay)
      }

      function showStatus(message) {
        clearTimeout(statusTimer)
        $('status').textContent = message
        $('status').hidden = false
        statusTimer = setTimeout(() => {
          $('status').hidden = true
        }, STATUS_MS)
      }

      function hideTip() {
        clearTimeout(tipTimer)
        tipHeader = null
        $('tip').hidden = true
      }

      // 기본 title 툴팁은 너비를 정할 수 없어서 패널 너비로 직접 그린다.
      function showTip(header) {
        const tip = $('tip')
        tip.textContent = header.dataset.tip
        tip.hidden = false
        const { top, bottom } = header.getBoundingClientRect()
        const fitsBelow = bottom + TIP_GAP_PX + tip.offsetHeight <= innerHeight
        tip.style.top = `${fitsBelow ? bottom + TIP_GAP_PX : Math.max(0, top - TIP_GAP_PX - tip.offsetHeight)}px`
      }

      async function applyToTerminal(note, button) {
        button.disabled = true
        showError(null)
        try {
          const result = await orca.plugin.request('terminal.apply', { text: note.text })
          if (result.error) showError(result.error)
          else showStatus(result.flattened ? `'${result.title}'에 넣었습니다. 일반 셸의 여러 줄 메모라 한 줄로 합치고 실행하지 않았습니다.` : `'${result.title}'에서 실행했습니다.`)
        } catch (error) {
          showError(`터미널에 보내지 못했습니다. ${error?.message ?? error}`)
        }
        button.disabled = false
      }

      // 메모 html은 innerHTML로 그려지고 패널 CSP는 인라인 스크립트를 허용한다. 파일에서 온 html은 편집기 서식만 남긴다.
      function cleanHtml(html) {
        const { body } = new DOMParser().parseFromString(html, 'text/html')
        for (const element of body.querySelectorAll('*')) {
          for (const { name } of [...element.attributes]) element.removeAttribute(name)
          if (!NOTE_TAGS.has(element.tagName)) element.replaceWith(...element.childNodes)
        }
        return body.innerHTML
      }

      async function backup() {
        showError(null)
        try {
          const { status } = await orca.files.saveAs({
            suggestedName: `sticky-notes-${new Date().toLocaleDateString('sv')}.json`, // sv 로캘이 현지 날짜를 YYYY-MM-DD로 준다.
            mimeType: 'application/json',
            data: backupJson(notes)
          })
          if (status === 'saved') showStatus(`메모 ${persistable(notes).length}개를 백업했습니다.`)
        } catch {
          showError('백업하지 못했습니다.')
        }
      }

      async function importBackup(file) {
        showError(null)
        try {
          const imported = parseBackup(await file.text()).map((note) => ({ ...note, html: cleanHtml(note.html) }))
          const merged = mergeNotes(notes, imported)
          const added = merged.filter((note) => !notes.includes(note)).length
          notes = merged
          flush()
          renderList()
          showStatus(added ? `메모 ${added}개를 가져왔습니다.` : '새로 가져올 메모가 없습니다.')
        } catch {
          showError('백업 파일을 읽지 못했습니다.')
        }
      }

      function onActivate(element, handler) {
        element.addEventListener('click', handler)
        element.addEventListener('keydown', (event) => {
          if (event.key !== 'Enter' && event.key !== ' ') return
          event.preventDefault()
          handler()
        })
      }

      function card(note) {
        const element = document.createElement('div')
        element.className = 'card'
        element.style.setProperty('--c', COLORS[note.color])

        const body = document.createElement('div')
        body.className = 'card-body'
        body.tabIndex = 0
        body.setAttribute('role', 'button')
        body.setAttribute('aria-label', (note.title || note.text).slice(0, 80))

        const date = document.createElement('div')
        date.className = 'date'
        date.textContent = formatDate(note.updatedAt, orca.locale)

        const preview = document.createElement('div')
        preview.className = 'preview'
        preview.innerHTML = note.html // 붙여넣기와 끌어놓기를 일반 텍스트로 제한해서 편집기 서식만 들어 있다.

        const top = document.createElement('div')
        top.className = 'card-top'
        top.dataset.tip = note.text.trim() || note.title // 제목만 있는 메모는 보여줄 내용이 없다.
        top.append(date)

        if (note.title.trim()) {
          const heading = document.createElement('div')
          heading.className = 'card-title'
          heading.textContent = note.title
          top.prepend(heading)

          // 내용이 있는 메모만 접는다. 제목만 있으면 접을 것이 없고, 본문 영역이 상세보기 입구로 남아야 한다.
          if (note.text.trim()) {
            const setOpen = (open) => {
              body.hidden = !open
              top.classList.toggle('divided', open)
              heading.setAttribute('aria-expanded', String(open))
            }
            heading.tabIndex = 0
            heading.setAttribute('role', 'button')
            setOpen(expanded.has(note.id))
            onActivate(heading, () => {
              const open = !expanded.delete(note.id)
              if (open) expanded.add(note.id)
              setOpen(open)
            })
          }
        }
        if (note.pinned) {
          const pin = $('pin').querySelector('svg').cloneNode(true)
          pin.classList.add('card-pin')
          pin.setAttribute('role', 'img')
          pin.setAttribute('aria-label', '고정됨')
          ;(top.querySelector('.card-title') ?? top).prepend(pin) // 제목 안에 넣어야 접기 아이콘이 맨 앞에 온다.
        }
        body.append(preview)
        onActivate(body, () => openNote(note))
        element.append(top, body)

        // 제목만 있는 메모는 넣을 내용이 없다.
        if (note.text.trim()) {
          const apply = document.createElement('button')
          apply.className = 'apply'
          apply.textContent = '적용'
          apply.title = '활성 터미널에 메모 내용을 넣고 실행'
          apply.addEventListener('click', () => applyToTerminal(note, apply))
          top.append(apply)
        }
        return element
      }

      function renderList() {
        const query = $('query').value
        const shown = visibleNotes(notes, query, $('scope').value)
        if (shown.length) {
          $('cards').replaceChildren(...shown.map(card))
          return
        }
        const empty = document.createElement('p')
        empty.className = 'empty'
        empty.textContent = query.trim() ? '검색 결과가 없습니다.' : '메모가 없습니다. + 버튼으로 추가하세요.'
        $('cards').replaceChildren(empty)
      }

      function renderSwatches() {
        for (const swatch of $('swatches').children) {
          swatch.setAttribute('aria-pressed', String(swatch.dataset.color === current.color))
        }
        $('note').style.setProperty('--c', COLORS[current.color])
      }

      function togglePalette(open) {
        $('swatches').hidden = !open
        $('palette').setAttribute('aria-expanded', String(open))
      }

      function emojiButton(glyph, name) {
        const button = document.createElement('button')
        button.textContent = glyph
        button.setAttribute('aria-label', name)
        return button
      }

      function emojiSection(name, buttons) {
        const section = document.createElement('section')
        const heading = document.createElement('h2')
        heading.textContent = name
        const grid = document.createElement('div')
        grid.className = 'emoji-grid'
        grid.append(...buttons)
        section.append(heading, grid)
        return section
      }

      const tonedEmoji = (entry) => entry.s?.[emojiTone - 1] ?? entry.e

      function showEmojiPreview(button) {
        $('emoji-preview-glyph').textContent = button?.textContent ?? '😊'
        $('emoji-preview-name').textContent = button?.getAttribute('aria-label') ?? '기분이 어떠세요?'
      }

      function renderRecentEmojis() {
        emojiSections[0].querySelector('.emoji-grid').replaceChildren(...recentEmojis.map((emoji) => emojiButton(emoji, emojiNames.get(emoji) ?? emoji)))
      }

      function syncEmojiTab() {
        const top = $('emoji-sections').scrollTop + 1
        const active = emojiSections.findLastIndex((section) => !section.hidden && section.offsetTop <= top)
        for (const [index, tab] of [...$('emoji-tabs').children].entries()) tab.setAttribute('aria-pressed', String(index === active))
      }

      function filterEmojis() {
        const query = $('emoji-query').value
        for (const { button, entry } of emojiCells) button.hidden = !matchesEmoji(entry, query)
        // 자주 사용은 아래 분류와 겹쳐서 검색 결과에 넣지 않는다.
        emojiSections[0].hidden = Boolean(query.trim())
        for (const section of emojiSections.slice(1)) section.hidden = !section.querySelector('button:not([hidden])')
        $('emoji-empty').hidden = emojiSections.some((section) => !section.hidden)
        $('emoji-sections').scrollTop = 0
        syncEmojiTab()
      }

      function setEmojiTone(tone) {
        emojiTone = tone
        for (const [index, swatch] of [...$('tones').children].entries()) swatch.setAttribute('aria-pressed', String(index === tone))
        for (const { button, entry } of emojiCells) button.textContent = tonedEmoji(entry)
      }

      function buildEmojis() {
        emojiSections = [
          emojiSection('자주 사용', []),
          ...EMOJI_GROUPS.map(({ name, emojis }) => {
            const cells = emojis.map((entry) => ({ button: emojiButton(tonedEmoji(entry), entry.n), entry }))
            emojiCells.push(...cells)
            return emojiSection(name, cells.map((cell) => cell.button))
          })
        ]
        for (const { e, n, s = [] } of EMOJI_GROUPS.flatMap((group) => group.emojis)) {
          for (const glyph of [e, ...s]) emojiNames.set(glyph, n)
        }
        $('emoji-sections').append(...emojiSections)
        for (const [index, section] of emojiSections.entries()) {
          const tab = document.createElement('button')
          tab.className = 'icon'
          tab.title = section.firstChild.textContent
          tab.setAttribute('aria-label', tab.title)
          tab.innerHTML = `<svg viewBox="0 0 20 20">${EMOJI_TAB_ICONS[index]}</svg>`
          tab.addEventListener('click', () => {
            $('emoji-query').value = ''
            filterEmojis()
            $('emoji-sections').scrollTop = section.offsetTop
          })
          $('emoji-tabs').append(tab)
        }
      }

      function toggleEmojis(open) {
        $('emojis').hidden = !open
        $('emoji').setAttribute('aria-expanded', String(open))
        $('tones').classList.remove('open')
        if (!open) return
        if (!emojiSections.length) buildEmojis()
        renderRecentEmojis()
        showEmojiPreview()
        $('emoji-query').value = ''
        filterEmojis()
        $('emoji-query').focus()
      }

      function openNote(note) {
        current = note
        title.value = note.title
        editor.innerHTML = note.html
        $('pin').setAttribute('aria-pressed', String(note.pinned))
        togglePalette(false)
        toggleEmojis(false)
        $('confirm').hidden = true
        renderSwatches()
        $('list').hidden = true
        $('note').hidden = false
        // 새 메모는 제목부터, 기존 메모는 본문부터 입력한다.
        if (persistable([note]).length) editor.focus()
        else title.focus()
      }

      function closeNote() {
        current = null
        notes = persistable(notes)
        flush()
        renderList()
        $('note').hidden = true
        $('list').hidden = false
      }

      function deleteCurrent() {
        notes = notes.filter((note) => note !== current)
        closeNote()
      }

      function syncFormatButtons() {
        // 제목은 글꼴이 굵어서 커서가 거기 있으면 '굵게'가 켜진 것으로 읽힌다.
        const inEditor = document.activeElement === editor
        for (const button of document.querySelectorAll('[data-command]')) {
          button.setAttribute('aria-pressed', String(inEditor && document.queryCommandState(button.dataset.command)))
        }
      }

      async function load() {
        showError(null)
        try {
          const [stored, confirmSetting, recent, tone] = await Promise.all([
            orca.storage.get('notes'),
            orca.storage.get('confirmDelete'),
            orca.storage.get('recentEmojis'),
            orca.storage.get('emojiTone')
          ])
          notes = Array.isArray(stored) ? withDefaults(stored) : []
          confirmDelete = confirmSetting ?? true
          recentEmojis = recent ?? DEFAULT_EMOJIS
          setEmojiTone(tone ?? 0)
          loaded = true
          for (const id of ['add', 'backup', 'import']) $(id).disabled = false
          $('confirm-setting').checked = confirmDelete
          renderList()
        } catch {
          showError('메모를 불러오지 못했습니다.', load)
        }
      }

      for (const [name, value] of Object.entries(COLORS)) {
        const swatch = document.createElement('button')
        swatch.className = 'swatch'
        swatch.dataset.color = name
        swatch.style.setProperty('--c', value)
        swatch.setAttribute('aria-label', `색상 ${name}`)
        swatch.addEventListener('click', () => {
          current.color = name
          renderSwatches()
          scheduleSave()
        })
        $('swatches').append(swatch)
      }

      for (const [index, [name, color]] of SKIN_TONES.entries()) {
        const swatch = document.createElement('button')
        swatch.className = 'tone'
        swatch.title = `피부색: ${name}`
        swatch.setAttribute('aria-label', swatch.title)
        swatch.setAttribute('aria-pressed', String(index === 0))
        swatch.style.setProperty('--c', color)
        swatch.addEventListener('click', () => {
          // 닫혀 있으면 고른 색 하나만 보이고, 누르면 나머지가 펼쳐진다.
          const open = $('tones').classList.toggle('open')
          if (open) return
          setEmojiTone(index)
          orca.storage.set('emojiTone', index).catch(() => showError('설정을 저장하지 못했습니다.'))
        })
        $('tones').append(swatch)
      }

      $('emoji-sections').addEventListener('click', (event) => {
        const emoji = event.target.closest('button')?.textContent
        if (!emoji) return
        title.setRangeText(emoji, title.selectionStart, title.selectionEnd, 'end')
        title.dispatchEvent(new Event('input')) // 저장은 직접 입력과 같은 경로를 탄다.
        recentEmojis = pushRecent(recentEmojis, emoji)
        orca.storage.set('recentEmojis', recentEmojis).catch(() => showError('설정을 저장하지 못했습니다.'))
        toggleEmojis(false)
        title.focus()
      })
      for (const name of ['mouseover', 'focusin']) {
        $('emoji-sections').addEventListener(name, (event) => showEmojiPreview(event.target.closest('button')))
      }
      $('emoji-sections').addEventListener('mouseleave', () => showEmojiPreview())
      $('emoji-sections').addEventListener('scroll', syncEmojiTab)
      $('emoji-query').addEventListener('input', filterEmojis)
      $('emojis').addEventListener('keydown', (event) => {
        if (event.isComposing || event.key !== 'Escape') return
        event.preventDefault()
        toggleEmojis(false)
        title.focus()
      })

      for (const id of ['add', 'backup', 'import']) $(id).disabled = true
      $('backup').addEventListener('click', backup)
      $('import').addEventListener('click', () => $('import-file').click())
      $('import-file').addEventListener('change', async (event) => {
        await importBackup(event.target.files[0])
        event.target.value = '' // 같은 파일을 다시 고를 수 있게 한다.
      })
      $('add').addEventListener('click', () => {
        const note = newNote()
        notes.push(note)
        openNote(note)
      })
      $('gear').addEventListener('click', () => {
        const open = $('settings').hidden
        $('settings').hidden = !open
        $('gear').setAttribute('aria-expanded', String(open))
      })
      $('confirm-setting').addEventListener('change', (event) => {
        confirmDelete = event.target.checked
        orca.storage.set('confirmDelete', confirmDelete).catch(() => showError('설정을 저장하지 못했습니다.'))
      })
      $('collapse-all').addEventListener('click', () => {
        expanded.clear()
        renderList()
      })
      $('expand-all').addEventListener('click', () => {
        for (const note of notes) expanded.add(note.id)
        renderList()
      })
      $('cards').addEventListener('mouseover', (event) => {
        // 적용 버튼에는 자체 툴팁이 있다.
        const header = event.target.closest('.apply') ? null : event.target.closest('.card-top')
        if (header === tipHeader) return
        hideTip()
        tipHeader = header
        if (header) tipTimer = setTimeout(() => showTip(header), TIP_DELAY_MS)
      })
      for (const name of ['mouseleave', 'click', 'scroll']) $('cards').addEventListener(name, hideTip)
      $('query').addEventListener('input', renderList)
      $('scope').addEventListener('change', renderList)

      $('back').addEventListener('click', closeNote)
      $('pin').addEventListener('click', () => {
        current.pinned = !current.pinned
        $('pin').setAttribute('aria-pressed', String(current.pinned))
        scheduleSave()
      })
      $('palette').addEventListener('click', () => togglePalette($('swatches').hidden))
      $('emoji').addEventListener('click', () => toggleEmojis($('emojis').hidden))
      $('delete').addEventListener('click', () => {
        if (confirmDelete && persistable([current]).length) $('confirm').hidden = false
        else deleteCurrent()
      })
      $('confirm-yes').addEventListener('click', deleteCurrent)
      $('confirm-no').addEventListener('click', () => {
        $('confirm').hidden = true
      })

      title.addEventListener('input', () => {
        current.title = title.value
        current.updatedAt = Date.now()
        scheduleSave()
      })
      title.addEventListener('keydown', (event) => {
        if (event.isComposing) return // 한글 조합을 확정하는 Enter로 본문으로 넘어가지 않게 한다.
        if (event.key === 'Enter') editor.focus()
        if (event.key === 'Escape') closeNote()
      })

      editor.addEventListener('input', () => {
        // 내용을 모두 지워도 브라우저가 <br>을 남겨서 안내 문구가 보이지 않는다.
        if (!editor.textContent && !editor.querySelector('li')) editor.innerHTML = ''
        current.html = editor.innerHTML
        current.text = editor.innerText
        current.updatedAt = Date.now()
        scheduleSave()
      })
      editor.addEventListener('paste', (event) => {
        event.preventDefault()
        document.execCommand('insertText', false, event.clipboardData.getData('text/plain'))
      })
      editor.addEventListener('drop', (event) => event.preventDefault())
      editor.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') closeNote()
      })

      for (const button of document.querySelectorAll('[data-command]')) {
        button.addEventListener('mousedown', (event) => event.preventDefault()) // 편집기 선택 영역 유지
        button.addEventListener('click', () => {
          editor.focus()
          document.execCommand(button.dataset.command)
          syncFormatButtons()
        })
      }
      document.addEventListener('selectionchange', () => {
        if (current) syncFormatButtons()
      })

      // 패널이 닫힐 때 대기 중인 저장만 마친다. 변경이 없으면 쓰지 않아야 다른 곳의 저장을 덮어쓰지 않는다.
      const flushPending = () => {
        if (saveTimer !== null) flush()
      }
      addEventListener('pagehide', flushPending)
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) flushPending()
      })

      void load()
    </script>
  </body>
</html>
